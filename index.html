<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#202327">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AURORA">
<meta name="mobile-web-app-capable" content="yes">
<title>AURORA — Voir. Décider. Photographier.</title>
<style>
:root{
  --bg:#1c1f22;--bg2:#151719;--panel:#25292d;--panel2:#2b3035;
  --text:#f5f2e9;--muted:#a7aaa8;--line:#ffffff16;
  --amber:#d59a46;--blue:#6f9cc8;--red:#d65c52;--green:#6da878;
  --serif:Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;
  --safe-bottom:env(safe-area-inset-bottom);
}
*{box-sizing:border-box}
html{background:var(--bg2);scroll-behavior:smooth}
body{margin:0;background:
  radial-gradient(700px 420px at 50% -180px,#3b414855,transparent 70%),
  var(--bg2);color:var(--text);font-family:var(--sans);overflow-x:hidden}
button,input,textarea{font:inherit}
button{color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
a{color:inherit}
.app{min-height:100svh;padding-bottom:calc(88px + var(--safe-bottom))}
.top{
  position:sticky;top:0;z-index:80;height:58px;
  background:#1c1f22dc;border-bottom:1px solid var(--line);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)
}
.topin{height:100%;display:flex;align-items:center;justify-content:space-between;padding:0 17px}
.logo{font-size:12px;font-weight:800;letter-spacing:.25em}
.top-title{font-size:11px;color:var(--muted);letter-spacing:.1em}
.icon-btn{
  width:42px;height:42px;border:1px solid var(--line);border-radius:14px;
  background:#ffffff08;display:grid;place-items:center;font-size:18px
}
.shell{width:min(980px,100%);margin:auto;padding:0 18px}
.screen{padding:34px 0 28px;animation:appear .28s ease both}
@keyframes appear{from{opacity:.35;transform:translateY(6px)}to{opacity:1;transform:none}}
.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3,p{margin-top:0}
h1{font:600 clamp(48px,14vw,92px)/.88 var(--serif);letter-spacing:-.055em}
h2{font:600 clamp(34px,9vw,62px)/.94 var(--serif);letter-spacing:-.045em}
h3{font-size:18px;line-height:1.18}
.lead{font-size:19px;line-height:1.42;color:#e7e3da;max-width:700px}
.muted{color:var(--muted)}
.micro{font-size:12px;line-height:1.55;color:var(--muted)}
.spacer{height:20px}
.stack{display:grid;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.surface{
  border:1px solid var(--line);border-radius:24px;
  background:linear-gradient(145deg,#2a2e33,#22262a);
  box-shadow:0 18px 50px #0002
}
.action{
  width:100%;min-height:62px;padding:16px 17px;text-align:left;
  border:1px solid var(--line);border-radius:19px;background:#ffffff07;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  transition:transform .16s,background .16s,border-color .16s
}
.action:active{transform:scale(.985);background:#ffffff0d}
.action .left{display:grid;gap:5px}
.action .title{font-size:17px;font-weight:650}
.action .hint{font-size:12px;color:var(--muted);line-height:1.35}
.action .arrow{font-size:22px;color:#858b90}
.action.amber{border-top:2px solid #d59a4680}
.action.blue{border-top:2px solid #6f9cc880}
.action.red{border-top:2px solid #d65c5280}
.action.green{border-top:2px solid #6da87880}
.primary{
  width:100%;min-height:54px;padding:15px 18px;border:0;border-radius:17px;
  background:#f3f0e7;color:#202327;font-weight:700
}
.secondary{
  width:100%;min-height:52px;padding:14px 17px;border:1px solid var(--line);
  border-radius:17px;background:#ffffff08;text-align:left
}
.pillbar{display:flex;gap:7px;overflow:auto;padding:3px 0 7px;scrollbar-width:none}
.pillbar::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;border:1px solid var(--line);background:#ffffff06;color:var(--muted);padding:9px 12px;border-radius:999px;font-size:11px}
.pill.active{background:#f4f1e8;color:#202327;border-color:#f4f1e8}
.bottom{
  position:fixed;left:0;right:0;bottom:0;z-index:90;
  height:calc(76px + var(--safe-bottom));padding:7px 8px var(--safe-bottom);
  display:grid;grid-template-columns:repeat(5,1fr);gap:4px;
  background:#1d2023ed;border-top:1px solid var(--line);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)
}
.tab{border:0;background:none;color:#777d82;display:grid;place-items:center;gap:3px;font-size:9px}
.tab .ico{font-size:18px;line-height:1}
.tab.active{color:#fff}
.tab.active .ico{color:var(--amber)}
.fab{
  position:fixed;right:18px;bottom:calc(91px + var(--safe-bottom));z-index:85;
  width:58px;height:58px;border-radius:20px;border:1px solid #ffffff22;
  background:#f4f1e8;color:#202327;font-size:26px;box-shadow:0 14px 35px #0007
}
.session-card{padding:20px}
.session-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.session-title{font:600 30px/.95 var(--serif)}
.progress{height:5px;border-radius:99px;background:#ffffff0b;overflow:hidden;margin-top:16px}
.progress>i{display:block;height:100%;background:var(--amber);width:42%}
.metric-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.metric{padding:12px;border-radius:15px;background:#ffffff05;border:1px solid var(--line)}
.metric b{display:block;font-size:18px}
.metric span{font-size:10px;color:var(--muted)}
.section{padding:18px 0}
.section-head{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:12px}
.section-head h2{font-size:34px;margin:0}
.section-head button{border:0;background:none;color:var(--muted);font-size:11px}
.choice{
  min-height:118px;border:1px solid var(--line);border-radius:22px;
  background:linear-gradient(145deg,#2a2e33,#22262a);padding:17px;text-align:left
}
.choice .mark{font-size:10px;letter-spacing:.15em;color:var(--muted)}
.choice h3{font:600 25px/.95 var(--serif);margin:16px 0 7px}
.choice p{font-size:12px;color:var(--muted);line-height:1.45;margin:0}
.choice.amber{box-shadow:inset 0 2px 0 #d59a46}
.choice.blue{box-shadow:inset 0 2px 0 #6f9cc8}
.choice.red{box-shadow:inset 0 2px 0 #d65c52}
.choice.green{box-shadow:inset 0 2px 0 #6da878}
.question-card{padding:19px}
.question-card .q{font-size:11px;color:var(--amber);letter-spacing:.14em}
.question-card h3{font:600 26px/1 var(--serif);margin:10px 0}
.stepdots{display:flex;gap:6px;margin:16px 0 20px}
.stepdots i{width:7px;height:7px;border-radius:50%;background:#555b60}
.stepdots i.on{width:25px;border-radius:99px;background:var(--amber)}
.decision-result{padding:20px;border-left:2px solid var(--amber);background:#ffffff05;border-radius:0 20px 20px 0}
.decision-result .big{font:600 30px/1 var(--serif);margin:7px 0 12px}
.route{display:flex;align-items:center;gap:7px;overflow:auto;padding:3px 0 8px;scrollbar-width:none}
.route::-webkit-scrollbar{display:none}
.route span{flex:0 0 auto;font-size:10px;color:var(--muted);padding:7px 9px;border:1px solid var(--line);border-radius:999px}
.route b{font-size:11px;color:#646b70}
.photo-stage{
  border-radius:24px;overflow:hidden;background:#111;border:1px solid var(--line);
  position:relative;min-height:270px;display:grid;place-items:center
}
.photo-stage img{display:block;width:100%;max-height:520px;object-fit:contain}
.upload{
  min-height:160px;border:1px dashed #ffffff35;border-radius:22px;background:#ffffff05;
  display:grid;place-items:center;text-align:center;padding:20px
}
.upload input{display:none}
.analysis{display:none}
.hist{height:120px;display:flex;align-items:end;gap:2px;padding:12px;background:#111;border-radius:17px}
.hist i{flex:1;background:#a9aaa9aa;min-height:2px;border-radius:2px 2px 0 0}
.zones{position:absolute;inset:0;display:none}
.zones.on{display:block}
.zone{position:absolute;border:1px dashed #fff8;background:#ffffff0a;border-radius:14px;padding:7px;font-size:10px}
.zone.subject{left:35%;top:27%;width:30%;height:42%}
.zone.light{left:4%;top:7%;width:38%;height:34%}
.zone.frame{left:3%;bottom:5%;width:25%;height:22%}
.lab-tabs{display:flex;gap:7px;overflow:auto;scrollbar-width:none;padding-bottom:5px}
.lab-tabs::-webkit-scrollbar{display:none}
.lab-tab{flex:0 0 auto;border:1px solid var(--line);background:#ffffff05;color:var(--muted);padding:10px 13px;border-radius:999px;font-size:11px}
.lab-tab.active{background:#f4f1e8;color:#202327}
.lab{min-height:510px;position:relative;overflow:hidden;padding:18px}
.lab h3{font:600 31px/.95 var(--serif);margin:8px 0}
.lab .explain{font-size:12px;color:var(--muted);line-height:1.5;max-width:360px}
.control{display:grid;gap:7px;margin-top:15px}
.control label{font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
input[type=range]{width:100%;accent-color:var(--amber)}
.scene{position:absolute;inset:145px 0 0}
.sep-bg{position:absolute;inset:0;background:linear-gradient(115deg,#374552,#161a1e)}
.sep-sub{position:absolute;width:90px;height:145px;border-radius:50% 50% 35% 35%;background:linear-gradient(#d9b38a,#65473a);left:50%;top:45%;transform:translate(-50%,-50%);transition:.2s}
.sep-line{position:absolute;top:45%;left:50%;height:2px;width:0;background:#d59a46;transition:.2s}
.light-scene{background:linear-gradient(120deg,#14171a,#2e3439)}
.light-source{position:absolute;width:110px;height:110px;border-radius:50%;background:#e8c27e;box-shadow:0 0 80px 20px #d59a4660;left:22%;top:18%}
.light-human{position:absolute;width:105px;height:160px;border-radius:50%;background:radial-gradient(circle at 32% 30%,#efd0a5,#7d5b4c 55%,#222 92%);left:50%;top:45%;transform:translate(-50%,-50%)}
.light-shadow{position:absolute;width:160px;height:75px;border-radius:50%;background:#000b;filter:blur(20px);left:53%;top:66%}
.frame-scene{background:linear-gradient(180deg,#5b7180 0 52%,#2c352d 52%);overflow:hidden}
.frame-grid:before,.frame-grid:after{content:"";position:absolute;background:#6da87877}
.frame-grid:before{left:33.3%;width:1px;height:100%;box-shadow:calc(33.3vw) 0 #6da87800}
.frame-grid:after{top:33.3%;width:100%;height:1px;box-shadow:0 calc(33.3vw) #6da87800}
.frame-sub{position:absolute;width:62px;height:100px;border-radius:50% 50% 24% 24%;background:#d59a46;left:62%;top:48%;transform:translate(-50%,-50%);transition:.2s}
.frame-fg{position:absolute;left:0;bottom:0;width:35%;height:68%;background:#34454f;clip-path:polygon(0 30%,100% 0,100% 100%,0 100%);transition:.2s}
.sim-scene{background:linear-gradient(#607786 0 47%,#2c352d 47%);overflow:hidden}
.sim-near,.sim-far{position:absolute;border-radius:50%;background:#6f9cc8;transition:.15s}
.sim-near{width:100px;height:100px;left:16%;bottom:23%}
.sim-far{width:45px;height:45px;right:17%;bottom:36%}
.sim-person{position:absolute;width:58px;height:95px;border-radius:50% 50% 22% 22%;background:#d59a46;left:50%;bottom:21%;transform:translateX(-50%);transition:.15s}
.device-stage{height:520px;display:grid;place-items:center;perspective:1100px;overflow:hidden;background:radial-gradient(circle at 50% 35%,#3a4046,#17191b 68%)}
.device{width:180px;height:330px;position:relative;transform-style:preserve-3d;transition:.1s}
.device .layer{position:absolute;inset:0;border-radius:34px;border:1px solid #fff3;box-shadow:0 35px 80px #0009}
.device .back{background:linear-gradient(145deg,#5c5f63,#1a1b1d);transform:translateZ(-42px) scale(.95)}
.device .body{background:linear-gradient(145deg,#414449,#101214)}
.device .glass{inset:18px auto auto 18px!important;width:76px;height:96px;border-radius:22px;background:#181a1d;transform:translateZ(34px)}
.lens{position:absolute;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#8da5c2,#101318 60%);box-shadow:0 0 0 4px #24272a;transform:translateZ(16px)}
.l1{left:13px;top:13px}.l2{right:13px;top:13px}.l3{left:13px;bottom:13px}
.sensor{position:absolute;width:70px;height:50px;background:#b98f55;border-radius:10px;transform:translateZ(55px) translateY(110px)}
.device-caption{text-align:center;margin-top:-40px}
.device-caption b{font:600 26px var(--serif)}
.modal-back{
  position:fixed;inset:0;background:#0009;z-index:120;display:grid;align-items:end
}
.sheet{
  width:100%;max-height:90svh;overflow:auto;background:#25292d;
  border:1px solid var(--line);border-radius:28px 28px 0 0;padding:16px 18px calc(24px + var(--safe-bottom));
  box-shadow:0 -20px 70px #0008
}
.grab{width:38px;height:4px;border-radius:99px;background:#fff2;margin:0 auto 16px}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.close{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:#ffffff08}
.library-search{width:100%;min-height:54px;padding:15px;border:1px solid var(--line);border-radius:17px;background:#ffffff07;color:var(--text);outline:0}
.list{display:grid;gap:8px;margin-top:12px}
.item{border:1px solid var(--line);border-radius:18px;background:#ffffff05;padding:15px;text-align:left}
.item .meta{font-size:9px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.item h3{margin:7px 0 5px;font-size:17px}
.item p{font-size:12px;color:var(--muted);line-height:1.45;margin:0}
.empty{padding:30px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-bottom));transform:translateX(-50%) translateY(15px);opacity:0;z-index:160;background:#f4f1e8;color:#202327;padding:11px 15px;border-radius:999px;font-size:12px;transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.footer{padding:45px 0 20px;color:#62686d;font-size:10px;text-align:center}
@media(min-width:760px){
  .app{padding-bottom:0}.bottom{position:sticky;top:58px;bottom:auto;height:58px;width:min(980px,100%);margin:auto;border:1px solid var(--line);border-radius:18px;margin-top:10px;padding:4px 8px;background:#202327ef}
  .fab{bottom:28px}.screen{padding-top:55px}
  .choice{min-height:150px}.action{min-height:68px}
  .modal-back{align-items:center}.sheet{width:min(720px,92vw);max-height:86svh;border-radius:28px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="toast" class="toast"></div>
<script>
const DATA = {"cards":[{"id":"S01","fam":"situation","num":"01","title":"La pluie","intent":"Faire travailler le sol comme seconde source de lumière.","key":"Le sol double toutes les sources lumineuses de la ville.","blocks":[["Décisions sur place","list",["Le sol mouillé juste après l'averse, avant qu'il sèche.","Les flaques : descendez au ras de l'eau, le reflet grandit.","Les parapluies : des formes simples, colorées, qui se détachent.","Les vitres couvertes de gouttes, à photographier au travers."]],["Configuration actuelle — iPhone 17 Pro","kv",[["Objectif","1× (24 mm). Le 2× si vous restez à l'abri d'un porche"],["Format","ProRAW. Les hautes lumières des reflets se récupèrent"],["Exposition","− 0,7 EV : les reflets brillent, ne les brûlez pas"],["Mode Nuit","Désactivé si les gens marchent"],["Protection","Aucune nécessaire, mais essuyez l'objectif souvent"]]],["Ensuite, dans Lightroom","text","Baissez d'abord les hautes lumières pour retrouver les reflets, puis remontez le noir : une image de pluie doit rester profonde. Évitez tout preset qui réchauffe — la pluie est froide, c'est son sujet."]],"note":"Les gouttes sur l'objectif créent des halos que le traitement automatique interprète comme du flou et tente de corriger. Essuyez avant chaque prise plutôt que de corriger après.","q":["Q03","Q10"],"kw":"pluie mouille averse flaque parapluie reflet sol orage"},{"id":"S02","fam":"situation","num":"02","title":"Le brouillard","intent":"Rendre la profondeur lisible sans rien ajouter au cadre.","key":"Il sépare les plans gratuitement : plus c'est loin, plus c'est pâle.","blocks":[["Décisions sur place","list",["Un sujet sombre proche : c'est lui qui donnera l'échelle du blanc.","Des rangées d'objets identiques qui s'éloignent — arbres, poteaux, arches.","Les sources lumineuses : elles deviennent des halos.","Ne cherchez pas le détail. Cherchez la silhouette."]],["Configuration actuelle — iPhone 17 Pro","kv",[["Objectif","2× (48 mm) ou 4× (100 mm) : la longue focale empile les plans"],["Format","ProRAW impérativement — le brouillard est fragile"],["Exposition","+ 0,3 à + 0,7 EV : sinon l'automatisme le rend gris"],["Mise au point","Touchez le sujet proche ; l'autofocus se perd dans le blanc"],["HDR","Le traitement cherche à percer la brume. Le ProRAW le limite"]]],["Ensuite, dans Lightroom","text","Ne remontez jamais le contraste global : vous détruiriez l'effet. Travaillez uniquement le sujet proche — un peu de noir, un peu de clarté locale — et laissez le fond laiteux."]],"note":"L'appareil considère une scène blanche comme surexposée et l'assombrit systématiquement. Avec la neige, c'est la seule situation où il faut surexposer volontairement.","q":["Q05","Q08"],"kw":"brouillard brume laiteux plans blanc profondeur"},{"id":"S03","fam":"situation","num":"03","title":"Les néons et les vitrines","intent":"Laisser la lumière choisir le sujet, et protéger les sources.","key":"Le noir doit rester noir. Sous-exposez franchement.","blocks":[["Décisions sur place","list",["Une flaque de lumière au sol, et attendez que quelqu'un y entre.","Les vitrines : elles éclairent les passants comme un studio.","Une seule couleur dominante par image. Deux néons opposés se neutralisent.","Les visages éclairés par le bas : dramatique, souvent trop. Préférez de côté."]],["Configuration actuelle — iPhone 17 Pro","kv",[["Objectif","1× exclusivement. Les autres capteurs décrochent la nuit"],["Format","ProRAW 12 Mpx. Le 48 Mpx n'apporte rien sans lumière"],["Exposition","− 1,0 à − 2,0 EV, mesure sur l'enseigne"],["Mode Nuit","Désactivé dès qu'un passant bouge"],["Tenue","Adossé à un mur, coudes serrés, expirez avant de déclencher"]]],["Ensuite, dans Lightroom","text","Ne remontez pas l'exposition globale : travaillez les ombres seules. Attention aux verts et magentas des LED, qui virent sur les peaux — corrigez-les en teinte ciblée plutôt qu'en balance des blancs globale."]],"note":"Les enseignes saturées brûlent avant tout le reste, et une enseigne brûlée devient un aplat blanc sans couleur. C'est irrécupérable, même en ProRAW.","q":["Q03","Q10"],"kw":"neon nuit vitrine enseigne led sombre urbain noir"},{"id":"S04","fam":"situation","num":"04","title":"Le café, l'intérieur","intent":"Obtenir une lumière douce et directionnelle sans matériel.","key":"Une fenêtre est une source large et proche : la lumière la plus douce qui existe.","blocks":[["Décisions sur place","list",["La table la plus proche de la fenêtre, jamais celle du fond.","Le sujet de trois quarts par rapport à la vitre, pas face à elle.","Un mur clair en face : il renvoie la lumière et ouvre les ombres.","Photographiez à travers l'encadrement, depuis l'extérieur : la vitre ajoute un reflet."]],["Configuration actuelle — iPhone 17 Pro","kv",[["Objectif","2× (48 mm) : proportions naturelles du visage"],["Format","ProRAW Max en 1×, ProRAW 12 Mpx en 2×"],["Exposition","Mesure sur le visage, puis − 0,3 EV"],["À éviter","Le 0,5× à moins d'un mètre : il déforme les traits"],["Mode Portrait","Incompatible ProRAW. Préférez le 2× et le vrai recul"]]],["Ensuite, dans Lightroom","text","Une lumière de fenêtre demande très peu : un peu de blancs, un peu de noirs, et surtout ne touchez pas à la saturation des peaux. C'est aussi une situation où ne pas utiliser de preset est souvent le meilleur choix."]],"note":"Placez le sujet à un mètre de la fenêtre, pas au fond de la salle : la douceur d'une source vient de sa proximité autant que de sa taille.","q":["Q03","Q08"],"kw":"cafe interieur fenetre restaurant table portrait doux"},{"id":"S05","fam":"situation","num":"05","title":"L'architecture","intent":"Décider d'une géométrie : parallèle ou franchement fuyante.","key":"Téléphone parfaitement vertical, ou franchement incliné. Jamais entre les deux.","blocks":[["Décisions sur place","list",["Reculez et tenez le téléphone vertical, quitte à couper le sommet.","Ou assumez franchement : plaquez-vous au pied et regardez droit en l'air.","Un seul point de fuite : placez-vous dans l'axe, ou franchement de biais.","La lumière rasante du matin ou du soir révèle le relief des façades."]],["Configuration actuelle — iPhone 17 Pro","kv",[["Objectif","1× pour l'ensemble, 4× (100 mm) pour aplatir une façade"],["Niveau","Grille activée : le réticule apparaît à l'horizontale"],["À éviter","Le 0,5× : il exagère la fuite des verticales"],["Format","ProRAW Max — il reste de la marge pour redresser"],["Exposition","Mesure sur la façade éclairée, − 0,3 EV"]]],["Ensuite, dans Lightroom","text","Redressez d'abord, recadrez ensuite, développez en dernier. Le redressement coûte des pixels sur les bords : c'est pourquoi le 48 Mpx est utile ici, et pourquoi il faut cadrer un peu large."]],"note":"Le grand-angle du 0,5× applique une correction de distorsion logicielle qui étire les coins. Sur une façade régulière, cela se voit. Préférez reculer en 1×.","q":["Q06","Q07"],"kw":"architecture batiment facade verticale penche immeuble"},{"id":"S06","fam":"situation","num":"06","title":"Le métro, les souterrains","intent":"Renoncer aux visages, exploiter la géométrie.","key":"Mauvaise lumière pour les visages, excellente géométrie.","blocks":[["Décisions sur place","list",["Les couloirs en enfilade et les escalators : lignes de fuite parfaites.","Le quai vide juste après le départ d'une rame.","Le contre-jour d'une sortie : les gens deviennent des silhouettes.","Les fenêtres de rame en mouvement : la couleur file, la personne reste."]],["Configuration actuelle — iPhone 17 Pro","kv",[["Objectif","1×. Le 0,5× seulement dans un couloir vraiment étroit"],["Format","ProRAW 12 Mpx"],["Exposition","− 0,7 EV et verrouillage AE/AF : la lumière change à chaque pas"],["Mode Nuit","Désactivé — il y a assez de lumière et tout bouge"],["Rafale","Oui, au moment où quelqu'un traverse le cadre"]]],["Ensuite, dans Lightroom","text","Les néons de métro sont souvent verts : c'est le cas type où corriger la teinte plutôt que la température. Ensuite, le noir et blanc résout beaucoup de problèmes ici."]],"note":"Photographier dans le métro est réglementé selon les villes et les réseaux, et le pied y est presque toujours interdit. Renseignez-vous avant, en particulier à l'étranger.","q":["Q07","Q09"],"kw":"metro souterrain couloir quai tunnel escalator"},{"id":"S07","fam":"situation","num":"07","title":"Les reflets","intent":"Montrer ensemble deux choses qui ne tiennent pas dans un cadre.","key":"Deux images pour le prix d'une. L'axe doit tomber au milieu exact.","blocks":[["Décisions sur place","list",["Descendez : plus l'appareil est bas, plus la surface réfléchissante est grande.","Une flaque de trente centimètres suffit à contenir un immeuble entier.","Dans une vitrine, cherchez la superposition : ce qui est dedans et ce qui est derrière vous.","Le reflet est toujours plus sombre que la scène : mesurez sur lui, pas sur le ciel."]],["Configuration actuelle — iPhone 17 Pro","kv",[["Objectif","1×. Posez le téléphone au ras du sol, écran vers vous"],["Cadrage","Grille activée : l'axe de symétrie doit tomber au milieu"],["Exposition","Mesure sur le reflet, puis − 0,3 EV pour tenir le ciel"],["Format","ProRAW Max : l'écart entre reflet et ciel est important"]]],["Ensuite, dans Lightroom","text","Un reflet demande souvent deux traitements différents : le haut et le bas de l'image ne vivent pas dans la même lumière. Utilisez un dégradé linéaire plutôt qu'un réglage global, puis appliquez le preset par-dessus."]],"note":"Une ride suffit à casser un miroir. Cherchez le calme, ou assumez franchement la surface brisée — l'entre-deux ne fonctionne pas.","q":["Q06","Q10"],"kw":"reflet flaque miroir vitrine symetrie eau canal"},{"id":"S08","fam":"situation","num":"08","title":"Le portrait dans la rue","intent":"Séparer une personne de son décor et ouvrir son regard.","key":"Lumière douce, longue focale, fond éloigné. Les trois se règlent avec les pieds.","blocks":[["Décisions sur place","list",["Une lumière douce : à l'ombre d'un mur, sous un porche, par ciel couvert.","Un fond loin derrière la personne — jamais collé à elle.","Le regard vers la source de lumière : les yeux s'allument.","Une lumière de côté, jamais dans le dos du sujet en plein soleil."]],["Configuration actuelle — iPhone 17 Pro","kv",[["Objectif","2× (48 mm) au minimum, 4× (100 mm) idéalement"],["À éviter","Le 1× à moins d'un mètre : nez élargi, oreilles rétrécies"],["Format","ProRAW. Le mode Portrait est incompatible avec lui"],["Mise au point","Appui long sur l'œil, puis recadrez"],["Exposition","Mesure sur le visage, − 0,3 EV si le fond est clair"]]],["Ensuite, dans Lightroom","text","Ne touchez jamais à la saturation globale sur un portrait : elle attaque les peaux avant tout le reste. Travaillez en TSL sur les oranges seulement. Sur une peau très claire, réduisez systématiquement l'intensité du preset."]],"note":"Le flou d'arrière-plan du mode Portrait est calculé, pas optique : il se trompe sur les cheveux et les lunettes. Un vrai 4× à trois mètres donne un flou plus crédible, sans artefact.","q":["Q02","Q08"],"kw":"portrait visage personne peau modele rue flou arriere plan"},{"id":"S09","fam":"situation","num":"09","title":"Le marché, la foule","intent":"Extraire un seul sujet d'un désordre saturé.","key":"La seule stratégie qui fonctionne est soustractive : choisir un élément, éliminer le reste.","blocks":[["Décisions sur place","list",["Un étal d'une seule couleur : il devient un fond, pas un sujet.","Les mains : elles racontent le marché mieux que les visages.","Un auvent ou une bâche : la lumière qui passe au travers se colore.","Restez à un endroit et laissez la foule composer devant vous."]],["Configuration actuelle — iPhone 17 Pro","kv",[["Objectif","2× (48 mm) pour isoler, 1× pour l'ambiance générale"],["Format","ProRAW Max en 1× ; 12 Mpx suffit en 2×"],["Rafale","Indispensable : les gestes durent un dixième de seconde"],["Exposition","Verrouillez AE/AF sur l'étal, la lumière varie beaucoup"],["Discrétion","Écran à hauteur de poitrine plutôt qu'à hauteur d'œil"]]],["Ensuite, dans Lightroom","text","Résistez à la saturation : un marché est déjà saturé. Le meilleur développement est souvent une désaturation partielle, sauf sur une couleur qu'on garde."]],"note":"Photographier des personnes reconnaissables engage leur droit à l'image, et les règles varient d'un pays à l'autre. Dans le doute, montrez l'image, souriez, proposez de l'effacer.","q":["Q02","Q07"],"kw":"marche foule gens etal bruit couleurs monde"},{"id":"S10","fam":"situation","num":"10","title":"Le point de vue élevé","intent":"Transformer une ville traversée en surface lisible.","key":"La ville cesse d'être un décor traversé et devient une surface.","blocks":[["Décisions sur place","list",["Le moment où le soleil rase les toits : les ombres dessinent la ville.","Un premier plan proche — rambarde, angle de mur — pour donner l'échelle.","Une rue en enfilade, vue de haut : les gens deviennent des points.","L'heure bleue : les fenêtres s'allument et la ville devient une constellation."]],["Configuration actuelle — iPhone 17 Pro","kv",[["Objectif","4× (100 mm) pour empiler, 1× pour l'ensemble"],["Format","ProRAW Max en 1× : les détails lointains comptent"],["Stabilité","Posez sur la rambarde. En 4×, le moindre tremblement se voit"],["Exposition","− 0,7 EV si le ciel est dans le cadre"],["À éviter","Le 0,5× : il rapetisse tout et vide l'image"]]],["Ensuite, dans Lightroom","text","Les vues lointaines demandent presque toujours un peu de voile à retirer, mais très peu : un ciel de ville trop nettoyé devient artificiel. Réduisez le contraste du preset si l'air est brumeux."]],"note":"Photographier à travers une vitre depuis un observatoire produit reflets et voile. Collez l'objectif contre le verre, main en visière autour, et coupez le mode Nuit qui accentue les halos.","q":["Q05","Q08"],"kw":"toit vue elevee pont panorama hauteur ville"},{"id":"S11","fam":"situation","num":"11","title":"La neige","intent":"Contredire la mesure et garder de la matière dans le blanc.","key":"La seule situation où il faut surexposer. + 1 EV, sinon la neige devient grise.","blocks":[["Décisions sur place","list",["Un sujet sombre : sans lui, l'image n'a aucun point d'ancrage.","La neige qui tombe : elle n'est visible que sur un fond sombre.","Les traces de pas, les branches chargées, les toits — la texture du blanc.","Juste après la chute, avant que la ville la salisse."]],["Configuration actuelle — iPhone 17 Pro","kv",[["Exposition","+ 0,7 à + 1,3 EV. C'est la situation inverse de toutes les autres"],["Objectif","1× ou 2×"],["Format","ProRAW : le blanc est à un cheveu de la brûlure"],["Balance","La neige à l'ombre est franchement bleue. C'est vrai, pas un défaut"],["Batterie","Le froid la vide en quelques minutes. Gardez le téléphone contre vous"]]],["Ensuite, dans Lightroom","text","Décidez si votre neige est blanche ou bleue, et assumez : les deux sont justes, l'entre-deux ne l'est pas. Vérifiez qu'il reste du détail dans le blanc avant d'appliquer un preset."]],"note":"Sous les flocons, l'autofocus accroche la neige au lieu du sujet. Appui long sur le sujet pour verrouiller la mise au point avant de déclencher.","q":["Q10"],"kw":"neige hiver blanc froid flocon"},{"id":"S12","fam":"situation","num":"12","title":"Midi, la lumière que tout le monde fuit","intent":"Faire de l'ombre portée le sujet plutôt que le problème.","key":"Elle creuse les visages — mais elle est la seule à dessiner des ombres franches.","blocks":[["Décisions sur place","list",["Les ombres portées comme motif : grilles, feuillages, passages piétons.","L'architecture géométrique et les contrastes francs.","Le côté ombragé de la rue : une lumière douce, réfléchie par la façade d'en face.","Les intérieurs : une fenêtre à midi est une des plus belles lumières qui soient."]],["Configuration actuelle — iPhone 17 Pro","kv",[["Objectif","1× pour l'ensemble, 4× pour isoler un motif d'ombre"],["Exposition","Verrouillez sur la zone claire, puis − 0,5 EV environ"],["Format","ProRAW : l'écart entre soleil et ombre est maximal"],["Geste","Baissez l'appareil vers le sol et inclinez-le : l'ombre devient motif"]]],["Ensuite, dans Lightroom","text","Le noir et blanc résout beaucoup de choses à midi. Si vous gardez la couleur, descendez les ombres plutôt que de les ouvrir : la dureté est le sujet."]],"note":"Un ciel de midi brûlé ne se récupère pas, même en ProRAW ; une ombre bouchée, si. À éviter : les visages en plein soleil, les paysages sans relief, tout ce qui repose sur la douceur.","q":["Q04","Q09"],"kw":"midi soleil plein dur ombre portee contraste chaud"},{"id":"Y01","fam":"symptome","num":"01","title":"L'image entière","intent":"","key":"Quand la gêne porte sur la photographie dans son ensemble.","blocks":[["","sym",[["« Ça manque de relief »","Lumière frontale, ou un seul plan de profondeur.","Cherchez la direction des ombres, puis faites entrer un élément proche dans le cadre.","10 · 12"],["« C'est fade, sans force »","Contraste réel faible, souvent un ciel couvert.","Ce n'est pas un défaut du fichier. Le contraste se remet au développement, pas à la prise de vue.","19 · 46"],["« Ça fait photo de téléphone »","Prise à hauteur d'œil, debout, en 1×, au milieu de la journée.","Changez une seule variable : baissez-vous, ou passez en 2×, ou revenez une heure plus tard.","26 · 59"],["« C'est encombré »","Plusieurs sujets d'égale force.","Retirez plutôt qu'ajouter : un pas de côté, un resserrement, l'attente que quelqu'un sorte.","12 · 13"],["« L'image paraît penchée »","Verticales convergentes ou horizon non aligné.","Activez la grille et le niveau. Une inclinaison se corrige au recadrage, mais au prix des bords.","41 · 23"],["« Elle ne raconte rien »","Cadrage descriptif, sans point de vue.","Demandez-vous ce que vous voulez montrer : le sujet dans son espace, ou contre son décor.","27 · 08"]]]],"note":"Presque aucune de ces gênes ne se répare après coup. Elles se décident au moment où vous choisissez où poser vos pieds. Les numéros renvoient au Livre.","q":["Q01","Q05"],"kw":"plat fade relief encombre penche global raconte rien banal"},{"id":"Y02","fam":"symptome","num":"02","title":"Le sujet","intent":"","key":"Quand quelque chose empêche le regard d'arriver là où il devrait.","blocks":[["","sym",[["« Mon sujet se perd dans le décor »","Aucune séparation entre le sujet et son fond.","Il en faut une des quatre : ton, couleur, netteté ou bord. Changez de place, pas de réglage.","09 · 12"],["« Il paraît trop petit »","Trop loin, ou focale trop courte.","Rapprochez-vous. Si c'est impossible, passez en 2× ou 4× — mais le fond changera aussi.","27 · 59"],["« Quelque chose sort de sa tête »","Poteau, antenne ou branche à l'arrière-plan.","Un pas de côté suffit presque toujours. Regardez le contour du crâne avant de déclencher.","12 · 24"],["« Il est coupé bizarrement »","Découpe tombée sur une articulation.","Ne coupez jamais au cou, au coude, au poignet, au genou ou à la cheville. Coupez entre deux.","25"],["« Il est collé au bord »","Espace laissé du mauvais côté.","Laissez le vide du côté où le sujet regarde ou avance, jamais derrière lui.","28 · 32"],["« J'ai raté l'instant »","Réglages faits pendant l'action, pas avant.","Choisissez le lieu, verrouillez l'exposition, puis attendez. Rafale au moment d'entrer.","40 · 20"]]]],"note":"Presque aucune de ces gênes ne se répare après coup. Elles se décident au moment où vous choisissez où poser vos pieds. Les numéros renvoient au Livre.","q":["Q02","Q06"],"kw":"sujet perd petit poteau coupe bord instant rate tete"},{"id":"Y03","fam":"symptome","num":"03","title":"Lumière et couleur","intent":"","key":"Quand la matière même de l'image ne va pas.","blocks":[["","sym",[["« Le ciel est tout blanc »","Hautes lumières brûlées, définitivement.","Exposez pour la zone claire et laissez tomber les ombres. Ou excluez le ciel du cadre.","38 · 39"],["« C'est trop sombre et ça grésille »","Sous-exposition en basse lumière.","Restez en 1×, le seul capteur qui tient la nuit. Une image nette et bruitée vaut mieux qu'une image propre et molle.","59 · 61"],["« C'est flou »","Temps de pose long, ou mode Nuit sur un sujet qui bouge.","Adossez-vous, coudes serrés, expirez. Désactivez le mode Nuit dès que quelque chose bouge.","61"],["« Les visages sont gris et froids »","Sujet à l'ombre, éclairé seulement par le ciel.","Ce n'est pas un défaut : la lumière est réellement bleue. Réchauffez au développement, ou cherchez un mur clair.","18 · 49"],["« Ça a l'air trop HDR, artificiel »","Le traitement automatique a débouché les ombres.","Passez en ProRAW : la correction est réduite. Puis abaissez les ombres au développement.","60 · 46"],["« Les couleurs partent dans tous les sens »","Trop de teintes saturées d'égale force.","Cherchez un fond uni ou une ombre. Une seule couleur isolée attire plus que cinq.","12 · 50"]]]],"note":"Presque aucune de ces gênes ne se répare après coup. Elles se décident au moment où vous choisissez où poser vos pieds. Les numéros renvoient au Livre.","q":["Q03","Q10"],"kw":"ciel blanc brule sombre bruit flou gris froid hdr couleurs"},{"id":"Y04","fam":"symptome","num":"04","title":"Les situations","intent":"","key":"Quand c'est le lieu ou la météo qui pose problème.","blocks":[["","sym",[["« Ma photo de nuit est floue »","Pose trop longue, ou mode Nuit sur un sujet qui bouge.","Coupez le mode Nuit dès que quelqu'un marche, adossez-vous, expirez avant de déclencher.","SIT 03"],["« Les néons sont complètement brûlés »","Mesure faite sur l'ombre, pas sur l'enseigne.","Une enseigne brûlée devient un aplat blanc sans couleur, irrécupérable. Sous-exposez de 1 à 2 EV.","SIT 03"],["« Ma neige est grise »","L'automatisme cherche un gris moyen devant une scène blanche.","C'est la seule situation où il faut surexposer : + 0,7 à + 1,3 EV.","SIT 11"],["« Mon architecture penche »","Téléphone incliné vers le haut : les verticales convergent.","Reculez et tenez l'appareil vertical, quitte à couper le sommet. Le 0,5× aggrave tout.","SIT 05"],["« Mon portrait paraît plat »","Lumière frontale, ou fond collé au sujet.","Lumière de côté, fond éloigné, 2× minimum. Aucun réglage ne remplace ces trois gestes.","SIT 08"],["« Le brouillard est devenu gris »","L'appareil a assombri une scène blanche.","Surexposez de 0,3 à 0,7 EV, et surtout ne remontez pas le contraste au développement.","SIT 02"]]]],"note":"Presque aucune de ces gênes ne se répare après coup. Elles se décident au moment où vous choisissez où poser vos pieds. Les numéros renvoient au Livre.","q":["Q09","Q10"],"kw":"nuit floue neon brule neige grise architecture penche portrait plat"},{"id":"Y05","fam":"symptome","num":"05","title":"Le développement","intent":"","key":"Quand le problème apparaît devant l'écran, et non sur le terrain.","blocks":[["","sym",[["« Ma photo paraît trop traitée »","Preset à pleine intensité, ou ombres et hautes lumières poussées à fond.","Baissez l'intensité à 60-70 %. Une image qui a perdu son noir et son blanc paraît toujours artificielle.","52 · 46"],["« Les couleurs sont trop agressives »","Saturation globale au lieu de vibrance ou de TSL.","Revenez à zéro, montez la vibrance, puis n'ajustez que le canal concerné.","50"],["« Les visages tirent vers l'orange »","Le canal orange du TSL est saturé par le preset.","Baissez la saturation des oranges de 10 à 20. Jamais la saturation globale.","50 · 52"],["« Le ciel est gris alors qu'il était magnifique »","Hautes lumières écrêtées à la prise de vue.","Rien à récupérer : le fichier est vide à cet endroit. Cela se corrige à la prise de vue, à − 0,7 EV.","48 · 39"],["« Mon image est plate après développement »","Ombres ouvertes et hautes lumières fermées à fond.","Réancrez : descendez les noirs jusqu'à retrouver un vrai point sombre.","46 · 48"],["« Je passe une heure et le résultat empire »","Trop de retouches successives sans repos.","Quatre minutes, puis on ferme. Rouvrez le lendemain : ce qui saute aux yeux est le seul vrai défaut.","53"]]]],"note":"Presque aucune de ces gênes ne se répare après coup. Elles se décident au moment où vous choisissez où poser vos pieds. Les numéros renvoient au Livre.","q":["Q12"],"kw":"traite preset saturation orange peau plate developpement"},{"id":"G01","fam":"geste","num":"01","title":"La chaîne de décision","intent":"","key":"L'intention d'abord, le réglage en dernier. Cet ordre ne change jamais.","blocks":[["","steps",[["Intention","Que voulez-vous montrer ? Une phrase, sans aucun nombre dedans."],["Décision photographique","Quelle séparation, quelle perspective, quel moment ?"],["Contrainte de la scène","Où pouvez-vous vous placer ? Quelle lumière est réellement disponible ?"],["Outil disponible","Quel angle de champ, quelle distance de travail, quelle latitude de fichier ?"],["Réglage","Et seulement maintenant, la commande précise sur l'appareil que vous tenez."]]]],"note":"Si la première phrase que vous vous dites contient un nombre, vous avez commencé par l'étape 5. Revenez à l'étape 1.","q":["Q02","Q11"],"kw":"chaine decision intention reglage ordre"},{"id":"G02","fam":"geste","num":"02","title":"Les trente secondes avant de déclencher","intent":"","key":"Dans cet ordre. Chaque étape prend cinq secondes.","blocks":[["","steps",[["Lumière — Q03","D'où viennent les ombres ? Placez-les en travers du sujet."],["Sujet — Q02","Un seul. Lequel ? Si vous hésitez, le spectateur hésitera."],["Fond — Q07","Regardez derrière. Zone brûlée, poteau, second sujet."],["Plans — Q05","Y a-t-il un premier plan ? Sinon, faites un pas de côté."],["Bords — Q07","Faites le tour du cadre du regard. Rien ne doit être coupé à moitié."],["Hauteur — Q06","Baissez-vous ou montez. La hauteur d'œil est le choix le plus banal."]]]],"note":"Puis déclenchez trois fois : une à hauteur d'œil, une plus bas, une plus près. Vous choisirez ce soir.","q":["Q01","Q03","Q07"],"kw":"avant declencher trente secondes checklist"},{"id":"G03","fam":"geste","num":"03","title":"Trouver la lumière en trente secondes","intent":"","key":"Avant même de sortir l'appareil.","blocks":[["","steps",[["Levez les yeux","Où est la zone la plus claire du ciel ? Tout part de là."],["Baissez les yeux","Bord d'ombre net ou flou ? Vous savez si la lumière est dure."],["Tournez sur vous-même","Repérez le côté de rue éclairé et le côté à l'ombre."],["Choisissez un mur","Celui qui reçoit la lumière : c'est votre réflecteur."],["Placez-vous","Vous êtes maintenant du bon côté de la scène."],["Puis seulement, cadrez","La lumière d'abord. Le sujet ensuite."]]]],"note":"Si aucune lumière ne vous convainc en trente secondes, ne forcez pas. Marchez cinq minutes et recommencez.","q":["Q03"],"kw":"trouver lumiere arriver sur place"},{"id":"G04","fam":"geste","num":"04","title":"Le tour du cadre en dix secondes","intent":"","key":"Toujours dans le même sens. Le geste doit devenir automatique.","blocks":[["","steps",[["Haut","Une zone claire s'échappe-t-elle par le bord ? Un objet coupé ?"],["Droite","Quelque chose entre-t-il à moitié dans le cadre ?"],["Bas","Le sujet est-il coupé sur une articulation ? Les pieds y sont-ils ?"],["Gauche","Un élément parasite plus contrasté que le sujet ?"],["Horizon","Est-il droit ?"],["Hauteur","Avant de valider : essayez une fois plus bas."]]]],"note":"Ce tour coûte dix secondes. Il vous épargnera la moitié des images que vous auriez supprimées le soir.","q":["Q07"],"kw":"tour du cadre bords dix secondes verifier"},{"id":"G05","fam":"geste","num":"05","title":"Développer en quatre minutes","intent":"","key":"Une discipline, pas un chronomètre : elle protège de l'acharnement.","blocks":[["","steps",[["Recadrer et redresser","Horizon droit, bords propres.  ·  30 s"],["Exposition","Le sujet à sa place. Rien d'autre.  ·  20 s"],["Hautes lumières, ombres, noirs","Récupérer, puis réancrer.  ·  60 s"],["Préréglage","Celui qui correspond à la lumière que vous aviez.  ·  20 s"],["Les trois gestes","Exposition, peaux, intensité.  ·  60 s"],["Reposer, puis regarder","Fermez, rouvrez. Ce qui saute aux yeux est le vrai défaut.  ·  30 s"]]]],"note":"Une image qu'on retouche pendant une heure finit presque toujours moins bien qu'après quatre minutes.","q":["Q12"],"kw":"developper quatre minutes lightroom retouche soir"},{"id":"G06","fam":"geste","num":"06","title":"La revue du soir","intent":"","key":"Le progrès vient du nombre de fois où l'on a su dire pourquoi.","blocks":[["","steps",[["Quelle est ma meilleure image ?","Une seule. Pas trois."],["Pourquoi celle-là ?","Nommez la raison : la lumière, la séparation, le moment, le cadre. Si vous ne savez pas nommer, c'était de la chance."],["Qu'est-ce qui l'aurait rendue meilleure ?","Un pas de côté, dix centimètres plus bas, deux secondes plus tard."],["Notez-le","Cette réponse devient la contrainte de la prochaine sortie."],["Rouvrez la sélection demain","La moitié tombera. C'est exactement là que se trouve le progrès."]]]],"note":"C'est la seule carte qui ne parle ni de lumière, ni de cadre, ni de réglage. C'est probablement la plus importante.","q":["Q12"],"kw":"revue du soir critique progres meilleure image"}],"intentions":[{"id":"I1","t":"Isoler ce sujet","q":"Q02","ex":"03","decision":"Augmenter l'écart entre le sujet et tout ce qui l'entoure — spatialement d'abord, tonalement ensuite, optiquement en dernier.","gestes":["Éloignez le fond du sujet, ou rapprochez-vous de lui.","Cherchez un fond plus sombre, plus clair ou plus lointain.","Resserrez l'angle de champ pour exclure le désordre.","Attendez que les sujets concurrents sortent du cadre."],"book":[[37,"Séparer un sujet de son monde"],[9,"Quatre façons de détacher un sujet"],[12,"Le fond décide de tout"]],"cards":["S08","S09"]},{"id":"I2","t":"Situer quelqu'un dans un lieu","q":"Q08","ex":"02","decision":"Reculer, élargir, et faire entrer un premier plan pour que le lieu raconte autant que la personne.","gestes":["Reculez physiquement plutôt que d'élargir depuis le même point.","Faites entrer un élément proche dans un coin du cadre.","Placez la personne là où les lignes se rejoignent.","Laissez le vide du côté où elle regarde ou avance."],"book":[[27,"La distance décide de l'histoire"],[10,"Trois distances dans un cadre"],[11,"Les lignes conduisent l'œil"]],"cards":["S10","S05"]},{"id":"I3","t":"Trouver la bonne lumière","q":"Q03","ex":"04","decision":"Lire la source avant de chercher un sujet : direction, dureté, hauteur, couleur. Puis se placer, et attendre.","gestes":["Levez les yeux : où est la zone la plus claire du ciel ?","Regardez un bord d'ombre : net, la lumière est dure ; flou, elle est douce.","Repérez le mur qui reçoit la lumière : c'est votre réflecteur.","Cadrez la zone éclairée vide, et laissez le sujet y entrer."],"book":[[14,"Cinq questions sur la lumière"],[15,"Dure ou douce : la taille apparente"],[17,"Six lumières, six usages"],[20,"Cadrer la lumière, attendre le sujet"]],"cards":["G03","S12","S04"]},{"id":"I4","t":"Attendre le bon moment","q":"Q09","ex":"06","decision":"Choisir un endroit, tout régler à l'avance, puis laisser la scène venir au point préparé.","gestes":["Cadrez la zone vide, exposition verrouillée, angle choisi.","Baissez l'appareil et regardez qui arrive de chaque côté.","Remontez une seconde avant que le sujet atteigne le point.","Rafale seulement si le geste dure moins d'un dixième de seconde."],"book":[[40,"Se placer, puis attendre"],[20,"Cadrer la lumière, attendre le sujet"]],"cards":["G02","S09"]},{"id":"I5","t":"Protéger ce que je vais perdre","q":"Q10","ex":"05","decision":"Nommer la zone critique, exposer pour elle, et laisser le reste tomber. Une ombre se relève, un blanc écrêté ne revient pas.","gestes":["Désignez la zone qui doit garder du détail. Une seule.","Mesurez dessus, verrouillez, puis recomposez.","Corrigez vers le bas jusqu'à ce que les clairs cessent d'être blancs.","Sauf devant du blanc dominant : là, il faut surexposer."],"book":[[38,"Exposer selon l'intention"],[39,"Mesurer, verrouiller, recomposer"],[19,"Ce que le capteur peut avaler"],[62,"Combien assombrir"]],"cards":["S11","S03"]},{"id":"I6","t":"Décider ce que je garde ce soir","q":"Q12","ex":"08","decision":"Trier avant de développer, puis suivre la boucle image · diagnostic · intention · décision · ajustement · vérification.","gestes":["Dix secondes par image : est-ce que je m'arrête dessus ?","Une seule version par scène, comparée côte à côte.","Quatre minutes de développement, puis on ferme.","Rouvrez le lendemain : ce qui saute aux yeux est le vrai défaut."],"book":[[44,"Trier, et jeter"],[45,"Le raisonnement de développement"],[53,"Développer en quatre minutes"],[52,"Ce qu'est réellement un préréglage"]],"cards":["G05","G06","Y05"]}],"book":[[2,"Trois objets, une méthode",[]],[3,"Les six niveaux d'Aurora",[]],[4,"La carte du territoire",[]],[5,"Les douze questions",[]],[6,"La légende permanente",[]],[8,"Où va l'œil",["Q01"]],[9,"Quatre façons de détacher un sujet",["Q01","Q02"]],[10,"Trois distances dans un cadre",["Q05"]],[11,"Les lignes conduisent l'œil",["Q01"]],[12,"Le fond décide de tout",["Q07"]],[13,"Retirer, jamais ajouter",["Q07"]],[14,"Cinq questions sur la lumière",["Q03"]],[15,"Dure ou douce : la taille apparente",["Q03"]],[16,"C'est l'ombre qui fabrique le volume",["Q03","Q04"]],[17,"Six lumières, six usages",["Q03","Q09"]],[18,"Pourquoi l'ombre est bleue",["Q03"]],[19,"Ce que le capteur peut avaler",["Q10"]],[20,"Cadrer la lumière, attendre le sujet",["Q03","Q09"]],[21,"Carte mémoire I",[]],[23,"Faire le tour du cadre",["Q07"]],[24,"Quatre accidents de bord",["Q07"]],[25,"Ne pas couper sur une articulation",["Q06"]],[26,"La hauteur change tout",["Q06"]],[27,"La distance décide de l'histoire",["Q08"]],[28,"Vertical ou horizontal, centre ou tiers",["Q06"]],[29,"Un cadre dans le cadre",["Q02","Q05"]],[30,"Symétrie et reflets",["Q06"]],[31,"La répétition, puis la rupture",["Q02"]],[32,"L'espace négatif et le poids visuel",["Q06"]],[33,"Le nombre d'or",["Q06"]],[34,"Carte mémoire II",[]],[36,"La chaîne de décision",["Q02","Q11"]],[37,"Séparer un sujet de son monde",["Q02","Q08"]],[38,"Exposer selon l'intention",["Q10"]],[39,"Mesurer, verrouiller, recomposer",["Q10"]],[40,"Se placer, puis attendre",["Q09","Q11"]],[41,"Recadrer : ce que ça répare",["Q06"]],[42,"Carte mémoire III",[]],[44,"Trier, et jeter",["Q12"]],[45,"Le raisonnement de développement",["Q12"]],[46,"Les quatre curseurs",["Q12"]],[47,"La courbe, sans mathématiques",["Q12"]],[48,"Lire l'histogramme",["Q10","Q12"]],[49,"Corriger la dominante, ou la garder",["Q03","Q12"]],[50,"La couleur, canal par canal",["Q12"]],[51,"Local, netteté, grain",["Q12"]],[52,"Ce qu'est réellement un préréglage",["Q12"]],[53,"Développer en quatre minutes",["Q12"]],[54,"Carte mémoire IV",[]],[56,"Sept niveaux, huit sorties",[]],[57,"Trois questions, et une case",[]],[59,"L'angle de champ disponible",["Q08"]],[60,"Quel format, quelle résolution",["Q10"]],[61,"Configurer l'appareil",["Q10"]],[62,"Combien assombrir",["Q10"]],[63,"Les curseurs, dans l'ordre",["Q12"]],[64,"Le jour où l'appareil change",["Q08"]]],"exercices":[["01","Une seule focale","Regard","Toute la sortie sur un seul angle de champ. Vous cessez de zoomer et vous vous mettez à marcher."],["02","Interdit debout","Composition","Aucune image à hauteur d'œil. Le point de vue est le levier le plus puissant et le moins utilisé."],["03","Le fond d'abord","Composition","Choisissez un fond propre, puis attendez qu'un sujet y entre."],["04","Le rai de lumière","Lumière","Trouvez une zone éclairée, cadrez-la, attendez trente minutes."],["05","La météo détestée","Anticipation","Sortez sous la pluie, le brouillard ou le ciel gris. Vous saurez exposer contre l'automatisme."],["06","Une heure, un lieu","Anticipation","Restez soixante minutes au même endroit. La dernière image ne ressemblera pas à la première."],["07","Dix images, pas onze","Décision","Dix déclenchements pour toute la sortie. Chaque image devient une décision assumée."],["08","Refaire","Autocritique","Retournez sur un lieu déjà photographié. Développez les deux séries côte à côte. Le seul exercice qui mesure votre progrès."]],"qlabel":{"Q01":"Où va mon œil ?","Q02":"Qu'est-ce que je veux isoler ?","Q03":"D'où vient la lumière ?","Q04":"Où sont les ombres ?","Q05":"Quel est mon premier plan ?","Q06":"Où est mon sujet dans le cadre ?","Q07":"Qu'est-ce qui parasite le cadre ?","Q08":"Quelle distance sert mon intention ?","Q09":"Quel moment dois-je attendre ?","Q10":"Quelle exposition protège l'image ?","Q11":"Est-ce que je déclenche maintenant ?","Q12":"Comment vais-je la développer ?"},"book_detail":{"8":{"eyebrow":"LE PREMIER QUART DE SECONDE","summary":"Devant une scène, votre œil se pose quelque part en moins d’un quart de seconde. Une photographie réussie est une photographie où votre regard et celui du spectateur vont au même endroit.","visual":"focus","takeaway":"Un seul point clair, un seul sujet net, un seul contraste fort : le regard n’a pas d’alternative."},"9":{"eyebrow":"LE MÉCANISME","summary":"Quatre leviers de séparation reviennent partout : ton, couleur, netteté, bord. Le test des yeux plissés permet de vérifier si la séparation existe.","visual":"separation","takeaway":"Aucune de ces quatre séparations ne se règle dans Lightroom : elles se décident d’abord au moment où vous choisissez où poser vos pieds."},"10":{"eyebrow":"PROFONDEUR","summary":"Une photographie est plate quand tout se trouve à la même distance. Faire entrer un élément proche suffit souvent à créer une troisième dimension.","visual":"depth","takeaway":"Premier plan · sujet · arrière-plan."},"11":{"eyebrow":"CONSTRUCTION","summary":"Une rue, un trottoir, une rambarde, une ombre portée : toute ligne est un chemin. Elle amène quelque part. Vérifiez toujours où.","visual":"lines","takeaway":"Placez le sujet là où les lignes se rejoignent, ou faites rentrer leur point de fuite dans le cadre."},"12":{"eyebrow":"TROIS SECONDES, AVANT CHAQUE IMAGE","summary":"Le fond enregistre aussi les quatre-vingts pour cent restants. Cinq défauts dominants peuvent détourner le regard du sujet.","visual":"frame","takeaway":"Trois secondes de vérification du fond corrigent plus d’images que trente minutes de retouche."},"36":{"eyebrow":"L’INVERSION QUI FAIT VIEILLIR AURORA CORRECTEMENT","summary":"La chaîne va de l’intention vers le réglage, jamais l’inverse. Elle reste vraie quel que soit l’appareil.","visual":"decision","takeaway":"Intention → décision photographique → contrainte de scène → outil disponible → réglage."},"37":{"eyebrow":"Q02 · QU’EST-CE QUE JE VEUX ISOLER ?","summary":"Isoler n’est pas grossir : c’est augmenter l’écart entre un sujet et tout ce qui l’entoure.","visual":"separation","takeaway":"Séparation spatiale → tonale et colorée → angle de champ → optique."},"38":{"eyebrow":"Q10 · QUELLE EXPOSITION PROTÈGE L’IMAGE ?","summary":"Exposer est une décision : au-delà d’un certain écart entre ombre et lumière, il faut choisir ce que l’on sauve.","visual":"exposure","takeaway":"Nommer la zone critique. Exposer pour elle. Sauf devant du blanc dominant."},"39":{"eyebrow":"LE GESTE QUI VAUT POUR TOUS LES APPAREILS","summary":"Mesurer, verrouiller, recomposer : le geste est universel ; seule la commande change.","visual":"decision","takeaway":"Choisir la zone critique → mesurer → verrouiller → corriger vers le bas → recomposer."},"40":{"eyebrow":"LA MÉTHODE DE LA RUE","summary":"Choisir un endroit, s’y installer, puis laisser les scènes venir. Cinq minutes au même endroit valent une heure de marche.","visual":"wait","takeaway":"Se placer, tout régler, baisser le téléphone, attendre, déclencher au point choisi."},"41":{"eyebrow":"APRÈS COUP","summary":"Le recadrage peut réparer certains accidents de bord, mais jamais la perspective, la lumière, le fond ou l’instant.","visual":"crop","takeaway":"Recadrer aide ; il ne remplace pas la prise de vue."},"44":{"eyebrow":"AVANT DE TOUCHER UN CURSEUR","summary":"Le tri est une compétence photographique. Choisir peu d’images permet de vraiment les travailler.","visual":"sort","takeaway":"10 secondes par image → garder une version par scène → revoir le lendemain."},"45":{"eyebrow":"AVANT LES CURSEURS","summary":"La boucle de développement ne dépend pas du logiciel : image → diagnostic → intention → décision → ajustement → vérification.","visual":"develop","takeaway":"Le préréglage arrive à l’étape 5 : il ne fait ni diagnostic, ni intention, ni décision."},"46":{"eyebrow":"ÉTAPES 4 À 6","summary":"Exposition, hautes lumières, ombres, noirs : quatre curseurs structurent la plupart des décisions tonales.","visual":"tones","takeaway":"Exposition d’abord, puis hautes lumières, ombres, noirs pour réancrer."},"47":{"eyebrow":"ÉTAPE 7","summary":"La courbe représente la relation entre luminosité d’origine et luminosité finale. Trois points suffisent sur un téléphone.","visual":"curve","takeaway":"Une courbe est un outil de contraste, pas une fin esthétique en soi."},"48":{"eyebrow":"L’INSTRUMENT","summary":"L’histogramme décrit combien de pixels occupent chaque luminosité. Il dit ce qui est perdu, pas ce qui est beau.","visual":"histogram","takeaway":"Il n’existe pas de bon histogramme universel."},"49":{"eyebrow":"ÉTAPE 3","summary":"La balance des blancs cherche votre intention, pas une neutralité obligatoire. Une dominante peut être corrigée ou assumée.","visual":"wb","takeaway":"Corriger quand la dominante est un accident ; la garder quand elle est le sujet."},"50":{"eyebrow":"ÉTAPE 8","summary":"Le TSL permet d’agir famille de couleur par famille de couleur. L’étalonnage agit en amont sur les primaires.","visual":"color","takeaway":"Vibrance plutôt que saturation globale ; orange pour la peau ; TSL pour corriger précisément."},"51":{"eyebrow":"ÉTAPES 9 ET 10","summary":"Le local sert à rétablir un équilibre, pas à peindre. Netteté, réduction du bruit et grain se travaillent avec retenue.","visual":"local","takeaway":"Un réglage local réussi ne se voit pas."},"52":{"eyebrow":"SANS MYTHOLOGIE","summary":"Un préréglage est une liste de positions de curseurs. Il ne connaît ni votre lumière, ni votre sujet, ni votre exposition.","visual":"preset","takeaway":"Rattraper l’exposition → vérifier les peaux → baisser l’intensité."},"53":{"eyebrow":"LE SOIR, UNE IMAGE À LA FOIS","summary":"Une discipline, pas un chronomètre : elle protège de l’acharnement.","visual":"develop","takeaway":"Recadrer → exposition → hautes lumières/ombres/noirs → préréglage → trois gestes → reposer et regarder."},"56":{"eyebrow":"UNE CONTRAINTE PAR SORTIE","summary":"Chaque exercice produit une compétence identifiable et chaque niveau suppose le précédent.","visual":"learn","takeaway":"Sept niveaux, huit sorties : regard, composition, lumière, anticipation, décision, autocritique."},"57":{"eyebrow":"APRÈS CHAQUE SORTIE","summary":"Le progrès vient du nombre de fois où l’on sait dire pourquoi une image était meilleure qu’une autre.","visual":"critique","takeaway":"Une meilleure image → pourquoi ? → qu’aurait-on changé ? → noter → réouvrir demain."},"59":{"eyebrow":"DE L’INTENTION À LA FOCALE","summary":"La distance décide du récit ; l’angle de champ décide de ce qui tient dans le cadre à cette distance.","visual":"device","takeaway":"L’angle de champ est un moyen, jamais l’intention."},"60":{"eyebrow":"UNE SEULE QUESTION","summary":"Quatre formats, avec des ordres de grandeur de poids et des usages différents. L’incertitude sur le 48 MP est volontairement conservée.","visual":"device","takeaway":"Le contrôle fiable reste ce que l’appareil affiche : l’incertitude n’est pas transformée en règle."},"61":{"eyebrow":"À FAIRE UNE SEULE FOIS","summary":"Configurer l’appareil, puis l’oublier : les réglages persistants sont une couche d’implémentation.","visual":"device","takeaway":"Le matériel ne doit pas devenir le système."},"62":{"eyebrow":"COMBIEN ASSOMBRIR","summary":"Les valeurs EV sont des points de départ, pas des consignes. Le contrôle fiable reste ce que l’on voit à l’écran.","visual":"exposure","takeaway":"Par défaut vers le bas ; devant neige, brouillard ou mur blanc dominant, contredire la mesure."},"63":{"eyebrow":"L’ORDRE DE TRAVAIL","summary":"Lightroom calcule selon son ordre interne. L’ordre proposé est une méthode de jugement, pas une contrainte technique.","visual":"develop","takeaway":"Profil → recadrage/redressement → balance → exposition → hautes lumières/ombres → blancs/noirs → courbe → couleur → local → netteté/grain."},"64":{"eyebrow":"CE QUI SE REMPLACE, CE QUI RESTE","summary":"Le module actuel est le seul à réécrire quand le matériel change. Les principes et décisions restent.","visual":"device","takeaway":"Remplacer le module matériel sans toucher aux principes, cartes universelles ni exercices."},"65":{"eyebrow":"QUINZE MOTS, ET PAS UN DE PLUS","summary":"Lexique des notions récurrentes : diaphragme, écrêtage, plage dynamique, ProRAW, HEIF, pixel binning, focale équivalente, zoom numérique.","visual":"lexicon","takeaway":"Définir précisément pour éviter les faux amis."},"66":{"eyebrow":"SUITE","summary":"Balance des blancs, Kelvin, profil, préréglage, courbe de tonalité, TSL / Mélangeur, étalonnage.","visual":"lexicon","takeaway":"Profil et préréglage sont deux choses différentes."},"67":{"eyebrow":"OÙ TROUVER QUOI","summary":"Le plan complet relie Livre, Cartes, questions Q et module matériel.","visual":"map","takeaway":"Le système remplace la pagination par des relations."}},"devices":{"iphone17pro":{"name":"iPhone 17 Pro","status":"ACTUEL","format":"ProRAW","development":"Lightroom mobile","angles":[{"label":"0,5×","eq":"13 mm","nature":"objectif réel","use":"Ouvrir un espace clos ; déforme fortement un visage proche."},{"label":"1×","eq":"24 mm","nature":"objectif réel","use":"Ouverture la plus large ; référence en basse lumière."},{"label":"2×","eq":"48 mm","nature":"recadrage · 12 MP","use":"Isoler sans déformer ; aucun pixel inventé."},{"label":"4×","eq":"100 mm","nature":"objectif réel","use":"Comprimer les plans ; resserrer un fond."},{"la    <p class="micro">Ne choisis pas un réglage. Choisis une intention.</p>

   <div class="grid2">${DATA.intentions.map((i,n)=>`<button class="choice ${["amber","blue","green","red"][n%4]}" data-a="intent:${esc(i.id)}"><div class="mark">INTENTION</div><h3>${esc(i.t)}</h3><p>${esc(i.decision)}</p></button>`).join("")}</div>

function explore(){
 const term=state.query.trim();
 let items=[];
 const add=(type,id,title,text,extra="")=>items.push({type,id,title,text,extra});
 if(!term){
   DATA.intentions.forEach(i=>add("intention",i.id,i.t,i.decision,i.q));
   DATA.cards.filter(c=>c.fam==="situation").forEach(c=>add("situation",c.id,c.title,c.key,c.q?.join(" · ")));
   Object.entries(Q).forEach(([k,v])=>add("question",k,v,"Porte d'entrée dans le système."));
 }else{
   const n=norm(term);
   DATA.intentions.forEach(i=>{const t=norm(i.t+" "+i.decision+" "+i.gestes.join(" ")+" "+i.q);if(t.includes(n))add("intention",i.id,i.t,i.decision,i.q)});
   DATA.cards.forEach(c=>{const t=norm(JSON.stringify(c));if(t.includes(n))add(c.fam,c.id,c.title,c.key,c.q?.join(" · "))});
   DATA.exercices.forEach(e=>{if(norm(e.join(" ")).includes(n))add("exercice",e[0],e[1],e[3],e[2])});
   Object.entries(Q).forEach(([k,v])=>{if(norm(k+" "+v).includes(n))add("question",k,v,"Porte d'entrée dans le système.")});
   DATA.book.forEach(b=>{if(norm(b.join(" ")).includes(n))add("livre",b[0],b[1],b[2]||"")});
 }
 return layout(`<section class="screen">
   <div class="eyebrow">EXPLORER · MÉMOIRE AURORA</div>
   <h2>Ne cherche pas<br>une page.</h2>
   <p class="micro">Cherche une intention, une situation, un symptôme, une question ou une idée. Le corpus reste derrière le moteur.</p>
   <input class="library-search" id="search" value="${esc(state.query)}" placeholder="« mon sujet se perd », « pluie », « Q03 »…">
   <div class="pillbar" style="margin-top:10px">${["all","intention","situation","symptome","question","exercice","livre"].map(x=>`<button class="pill ${state.filter===x?"active":""}" data-a="filter:${x}">${x==="all"?"Tout":x}</button>`).join("")}</div>
   <div class="list">${items.filter(x=>state.filter==="all"||x.type===state.filter).slice(0,60).map(x=>`<button class="item" data-a="open:${x.type}:${esc(x.id)}"><div class="meta">${esc(x.type)} ${esc(x.extra)}</div><h3>${esc(x.title)}</h3><p>${esc(x.text)}</p></button>`).join("") || `<div class="empty">Aucune correspondance. Essaie une intention, un symptôme ou une formulation plus simple.</div>`}</div>
 </section>`);
}

function openItem(type,id){
 let content="";
 if(type==="question"){
  content='<div class="eyebrow">'+esc(id)+'</div><h2>'+esc(Q[id]||"")+'</h2><p class="lead" style="font-size:16px">Cette question est une porte d\'entrée vers les principes, décisions, situations et exercices qui lui sont reliés.</p><button class="primary" data-a="nav:session">Construire une sortie autour de cette question</button>';
 } else if(type==="intention"){
  const x=DATA.intentions.find(i=>i.id===id); if(!x)return;
  content='<div class="eyebrow">INTENTION</div><h2>'+esc(x.t)+'</h2><div class="decision-result"><div class="big">'+esc(x.decision)+'</div><p class="micro">'+esc((x.gestes||[]).join(" · "))+'</p></div><button class="primary" style="margin-top:12px" data-a="start:intent:'+esc(id)+'">Utiliser cette intention</button>';
 } else if(type==="situation"){
  const c=DATA.cards.find(x=>x.id===id); if(!c)return;
  let blocks="";
  (c.blocks||[]).forEach(b=>{blocks+='<div class="surface" style="padding:15px;margin-top:9px"><div class="eyebrow">'+esc(b[0])+'</div>'; if(b[1]==="list") blocks+='<ul class="micro">'+(b[2]||[]).map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul>'; else blocks+='<p class="micro">'+esc(JSON.stringify(b[2]))+'</p>'; blocks+='</div>';});
  content='<div class="eyebrow">SITUATION · '+esc(c.id)+'</div><h2>'+esc(c.title)+'</h2><div class="decision-result"><div class="big">'+esc(c.key)+'</div><p class="micro">'+esc(c.intent||"")+'</p></div>'+blocks;
 } else if(type==="exercice"){
  const e=DATA.exercices.find(x=>x[0]===id); if(!e)return;
  content='<div class="eyebrow">EXERCICE '+esc(id)+'</div><h2>'+esc(e[1])+'</h2><p class="lead" style="font-size:16px">'+esc(e[3])+'</p><button class="primary" data-a="complete:'+esc(id)+'">Marquer comme réalisé</button>';
 } else if(type==="livre"){
  const b=DATA.book.find(x=>String(x[0])===String(id)); if(!b)return;
  content='<div class="eyebrow">LIVRE · '+esc(id)+'</div><h2>'+esc(b[1])+'</h2><p class="lead" style="font-size:16px">'+esc(b[2]||"")+'</p><p class="micro">Le contenu reste dans la mémoire du système et peut être rejoint depuis plusieurs chemins.</p>';

  content='<div class="eyebrow">SYMPTÔME</div><h2>'+esc(c.title)+'</h2><div class="decision-result"><div class="big">'+esc(c.key)+'</div><p class="micro">'+esc(c.intent||"")+'</p></div>';

}
function render(){
 const app=$("#app");
 if(state.route==="today") app.innerHTML=today();
 else if(state.route==="terrain") app.innerHTML=terrain();
 else if(state.route==="lab") app.innerHTML=lab();
 else if(state.route==="photos") app.innerHTML=photos();
 else if(state.route==="explore") app.innerHTML=explore();
 else if(state.route==="session") app.innerHTML=session();
 else app.innerHTML=today();
 bindDynamic();
}

function bindDynamic(){
 const search=$("#search"); if(search){search.addEventListener("input",()=>{state.query=search.value;render()});search.focus();search.setSelectionRange(search.value.length,search.value.length)}
 const p=$("#photoInput"); if(p)p.addEventListener("change",()=>{const f=p.files?.[0];if(!f)return;const url=URL.createObjectURL(f);$("#photoImg").src=url;$("#photoStage").style.display="grid";$("#zones").classList.add("on");$("#analysis").style.display="block";analyze(f)});
 const exp=$("#exp");if(exp) exp.addEventListener("input",()=>updateExposure(+exp.value));
 const sep=$("#sepRange");if(sep)sep.addEventListener("input",()=>updateSep(+sep.value));
 const lx=$("#lx");if(lx)lx.addEventListener("input",()=>updateLight(+lx.value,+(($("#ld")||{}).value||50)));
 const ld=$("#ld");if(ld)ld.addEventListener("input",()=>updateLight(+((($("#lx")||{}).value)||22),+ld.value));
 const fg=$("#fg");if(fg)fg.addEventListener("input",()=>{$("#frameFg").style.width=fg.value+"%";$("#fgVal").textContent=fg.value+"%"});
 const sub=$("#sub");if(sub)sub.addEventListener("input",()=>{$("#frameSub").style.left=sub.value+"%";$("#subVal").textContent=sub.value+"%"});
 const pos=$("#pos");if(pos)pos.addEventListener("input",()=>updatePerspective(+pos.value,+((($("#focal")||{}).value)||50)));
 const focal=$("#focal");if(focal)focal.addEventListener("input",()=>updatePerspective(+((($("#pos")||{}).value)||50),+focal.value));
 updateExposure(0);updateSep(50);updateLight(22,50);updatePerspective(50,50);
}

function updateSep(v){const s=$("#sepSub"),l=$("#sepLine"),bg=$("#sepBg");if(!s)return;const scale=.75+v/250;s.style.transform=`translate(-50%,-50%) scale(${scale})`;l.style.width=(v*.7)+"%";l.style.opacity=.2+v/120;$("#sepVal").textContent=v}
function updateLight(dir,dist){const src=$("#lightSource"),sh=$("#lightShadow");if(!src)return;const x=8+(dir/90)*65;const y=15+(1-dist/100)*42;src.style.left=x+"%";src.style.top=y+"%";sh.style.left=(48+dist/4)+"%";sh.style.transform=`scale(${1.25-dist/180})`;$("#lxVal").textContent=dir+"°";$("#ldVal").textContent=dist}
function updatePerspective(pos,focal){const n=$("#simNear"),f=$("#simFar"),p=$("#simPerson");if(!n)return;n.style.left=(8+pos*.32)+"%";f.style.right=(8+(100-pos)*.28)+"%";p.style.transform=`translateX(-50%) scale(${.75+focal/220})`;$("#posVal").textContent=pos;$("#focalVal").textContent=focal}
function updateExposure(v){const h=$("#labHist"),t=$("#expText");if(!h)return;const bins=Array.from({length:30},(_,i)=>Math.max(5,80-Math.abs(i-(15+v/12))*4));h.innerHTML=bins.map(x=>`<i style="height:${x}%"></i>`).join("");$("#expVal").textContent=v>0?"+"+v:v;t.textContent=v>45?"Les tons se déplacent vers les hautes lumières : vérifie ce que tu protèges.":v<-45?"Les ombres prennent le dessus : vérifie si ton sujet conserve l'information utile.":"La bonne exposition dépend de l'intention, pas d'une forme parfaite."}
function analyze(file){
 const img=new Image();img.onload=()=>{const c=document.createElement("canvas"),ctx=c.getContext("2d",{willReadFrequently:true});const scale=Math.min(1,640/img.width);c.width=Math.max(1,img.width*scale);c.height=Math.max(1,img.height*scale);ctx.drawImage(img,0,0,c.width,c.height);const d=ctx.getImageData(0,0,c.width,c.height).data,bins=new Array(32).fill(0);let sum=0,hi=0,lo=0,n=0;for(let i=0;i<d.length;i+=4){const y=.2126*d[i]+.7152*d[i+1]+.0722*d[i+2];sum+=y;hi+=y>=250;lo+=y<=5;bins[Math.min(31,Math.floor(y/8))]++;n++}const mx=Math.max(...bins);$("#photoHist").innerHTML=bins.map(x=>`<i style="height:${Math.max(2,x/mx*100)}%"></i>`).join("");$("#meanLum").textContent=Math.round(sum/n);$("#clipHi").textContent=(hi/n*100).toFixed(1)+" %";$("#clipLo").textContent=(lo/n*100).toFixed(1)+" %"};img.src=URL.createObjectURL(file)
}

function handle(a){
 const parts=a.split(":");const k=parts[0],v=parts.slice(1).join(":");
 if(k==="nav"){state.terrainChoice=null;nav(v);return}
 if(k==="menu"){document.body.insertAdjacentHTML("beforeend",menu());return}
 if(k==="close"){closeSheet();return}
 if(k==="new"){newSession();return}
 if(k==="start"){if(v==="shoot"){state.session={date:new Date().toISOString(),intent:null,situation:null,decision:null,shots:0,notes:[]};state.intent=state.situation=state.decision=null;save();nav("session");}else if(v==="intent"){const id=parts[2];const x=DATA.intentions.find(i=>i.id===id);if(x){state.session={date:new Date().toISOString(),intent:x.t,situation:null,decision:null,shots:0,notes:[]};state.intent=x;state.situation=null;nav("session")}}return}
 if(k==="intent"){const x=DATA.intentions.find(i=>i.id===v);state.intent=x;state.session.intent=x.t;save();render();return}
 if(k==="situation"){const x=DATA.cards.find(c=>c.id===v);state.situation=x;state.session.situation=x.title;save();render();return}
 if(k==="session"){if(v==="back"){if(state.situation){state.situation=null}else{state.intent=null}render()}else if(v==="launch"){state.session.decision=state.intent.decision;state.session.constraint=state.intent.gestes?.[0]||"";save();nav("terrain");toast("Contrainte emportée sur le terrain.")}return}
 if(k==="terrainI"){state.terrainChoice=state.terrainChoice||{};state.terrainChoice.i=+v;render();return}
 if(k==="terrainS"){state.terrainChoice.s=+v;render();return}
 if(k==="terrainReset"){state.terrainChoice={i:null,s:null};render();return}
 if(k==="lab"){state.lab=v;render();return}
 if(k==="device"){state.device=v;render();return}
 if(k==="filter"){state.filter=v;render();return}
 if(k==="q"){state.query=v;state.filter="question";nav("explore");return}
 if(k==="explore"){state.query="";state.filter="all";nav("explore");return}
 if(k==="open"){openItem(parts[1],parts.slice(2).join(":"));return}
 if(k==="diagnose"){const m={sujet:["SUJET","Avant de toucher à Lightroom, cherche la séparation : ton, couleur, netteté, bord ou distance."],lumiere:["LUMIÈRE","Lis la source, sa direction, sa taille apparente et ses ombres avant d'ajuster l'exposition."],fond:["FOND","Le fond concurrence-t-il le sujet ? Change d'abord ta position, la distance ou ce qui entre dans le cadre."],bord:["CADRE","Fais le tour du cadre. Un parasite de bord est souvent une décision de prise de vue."]};const x=m[v];$("#diagResult").style.display="block";$("#diagResult").innerHTML=`<div class="eyebrow">${x[0]}</div><div class="big">${x[1]}</div><p class="micro">Question utile : ${v==="lumiere"?"Q03 · Q04":v==="sujet"?"Q02 · Q08":"Q07 · Q06"}</p><button class="secondary" data-a="nav:lab">Tester dans le laboratoire →</button>`;return}
 if(k==="complete"){if(!state.done.includes(v)){state.done.push(v);save();toast("Exercice enregistré.");}return}
 if(k==="saveCritique"){state.critique={why:$("#critWhy")?.value||"",next:$("#critNext")?.value||"",date:new Date().toISOString()};save();toast("Revue enregistrée localement.");return}
 if(k==="toggle"){return}
}

document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(t){e.preventDefault();handle(t.dataset.a)}});

window.addEventListener("scroll",()=>{
 const d=$("#device");if(!d)return;
 const p=Math.min(1,Math.max(0,(scrollY-120)/700));
 d.style.transform=`rotateX(${8+p*10}deg) rotateY(${p*34-17}deg)`;
});

render();
if("serviceWorker" in navigator && location.protocol!=="file:"){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}
</script>
