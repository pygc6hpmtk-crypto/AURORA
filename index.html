<style>

:root{--bg:#202327;--panel:#292c31;--panel2:#2f3338;--ink:#f0eee9;--muted:#9b9da1;--rule:#41454b;--amber:#c78936;--blue:#5e8cb4;--red:#c4614e;--green:#7fa47c;--paper:#f3f1ec;--paperInk:#202327;--max:1180px;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth;background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);line-height:1.45}button,a,input,select{font:inherit}button,a{color:inherit}button{cursor:pointer}.topbar{position:fixed;z-index:50;top:0;left:0;right:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100vw - var(--max))/2));background:linear-gradient(var(--bg),rgba(32,35,39,.92),transparent);backdrop-filter:blur(10px)}.wordmark{font:600 12px var(--sans);letter-spacing:.36em;text-decoration:none;color:var(--amber)}.menu{border:1px solid var(--rule);background:rgba(32,35,39,.8);border-radius:999px;padding:8px 13px;color:var(--muted);font:600 11px var(--sans);letter-spacing:.12em}.drawer{position:fixed;z-index:60;inset:0 auto 0 0;width:min(380px,90vw);background:#1b1e21;border-right:1px solid var(--rule);transform:translateX(-105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);padding:26px;box-shadow:30px 0 70px #0008}.drawer.open{transform:none}.drawer-head{display:flex;justify-content:space-between;align-items:center;font:600 11px var(--sans);letter-spacing:.26em;color:var(--amber);margin-bottom:45px}.drawer-head button{background:none;border:0;color:var(--muted);font-size:10px;letter-spacing:.12em}.drawer nav{display:grid;gap:6px}.drawer nav a{text-decoration:none;padding:13px 0;border-bottom:1px solid var(--rule);font-size:26px}.drawer nav a:hover{color:var(--amber)}main{overflow:hidden}.section{padding:100px max(20px,calc((100vw - var(--max))/2));position:relative}.hero{min-height:100svh;display:grid;align-items:end;padding-top:110px;padding-bottom:70px;background:radial-gradient(circle at 70% 15%,#6e829e22,transparent 30%),var(--bg)}.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:60px;align-items:end}.eyebrow{font:600 11px var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--amber)}h1{font-size:clamp(64px,11vw,148px);line-height:.88;letter-spacing:-.055em;margin:18px 0 24px;font-weight:600}h2{font-size:clamp(42px,6vw,78px);line-height:.95;letter-spacing:-.04em;margin:10px 0 22px}h3{font-size:27px;line-height:1.05;margin:0 0 8px}.lede{font-size:clamp(20px,2.2vw,28px);color:#c9c6bf;max-width:720px}.micro{font:12px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.hero-art{min-height:520px;position:relative;display:grid;place-items:center;perspective:1000px}.street{width:min(560px,90vw);aspect-ratio:1/1;position:relative;overflow:hidden;background:linear-gradient(#7d9cc4 0 28%,#cdbf9d 50%,#2a2d32 70%);border-radius:28px;box-shadow:0 35px 100px #0007;transform:rotateX(4deg)}.street:before,.street:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 48%,#fff2 49%,transparent 50%),linear-gradient(70deg,transparent 48%,#fff1 49%,transparent 50%);opacity:.6}.street .wall{position:absolute;top:0;width:45%;height:66%;background:#c78936;opacity:.62;clip-path:polygon(0 0,100% 0,78% 100%,0 100%)}.street .wall.r{right:0;transform:scaleX(-1);background:#a7a09a}.street .person{position:absolute;width:24px;height:78px;background:#17191b;border-radius:14px 14px 8px 8px;left:50%;top:51%;transform:translate(-50%,-50%)}.street .person:before{content:"";position:absolute;width:24px;height:24px;border-radius:50%;background:#17191b;top:-20px}.street .road{position:absolute;left:50%;bottom:-10%;width:70%;height:70%;transform:translateX(-50%) perspective(400px) rotateX(58deg);background:linear-gradient(90deg,#25282c,#45494e,#25282c);clip-path:polygon(48% 0,52% 0,100% 100%,0 100%)}.street .road:after{content:"";position:absolute;left:48%;top:0;width:4%;height:100%;background:repeating-linear-gradient(#e9e7e1 0 9%,transparent 9% 17%);opacity:.65}.scroll-note{position:absolute;right:20px;bottom:25px;writing-mode:vertical-rl;font:10px var(--sans);letter-spacing:.2em;color:var(--muted)}.pillrow{display:flex;flex-wrap:wrap;gap:9px;margin:25px 0}.pill{border:1px solid var(--rule);border-radius:999px;padding:9px 13px;background:transparent;font:600 11px var(--sans);letter-spacing:.08em}.pill.active,.pill:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}.dark-band{background:#1b1e21}.paper-band{background:var(--paper);color:var(--paperInk)}.split{display:grid;grid-template-columns:1fr 1fr;gap:22px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:var(--panel);border:1px solid var(--rule);border-radius:20px;padding:22px;min-height:180px;position:relative;overflow:hidden}.card:hover{border-color:#6b7078;transform:translateY(-2px);transition:.25s}.card .code{font:600 10px var(--sans);letter-spacing:.16em;color:var(--muted)}.card .accent{position:absolute;left:0;top:0;bottom:0;width:3px}.card p{color:var(--muted);margin:10px 0 0}.cycle{position:relative;max-width:850px;aspect-ratio:1/1;margin:30px auto}.cycle svg{width:100%;height:100%}.cycle-node{position:absolute;transform:translate(-50%,-50%);border:1px solid var(--rule);border-radius:999px;padding:10px 14px;background:#2b2e33;font:600 10px var(--sans);letter-spacing:.1em}.cycle-node:hover{border-color:var(--amber);color:var(--amber)}.node-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.node{background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:18px;text-align:left}.node small{font:600 10px var(--sans);letter-spacing:.12em;color:var(--muted)}.node strong{display:block;font-size:21px;margin-top:5px}.interactive{background:linear-gradient(145deg,#262a2f,#1b1e21);border:1px solid var(--rule);border-radius:28px;padding:25px;overflow:hidden}.lab{display:grid;grid-template-columns:1fr .8fr;gap:25px;align-items:center}.stage{min-height:360px;position:relative;background:#e9e7e1;border-radius:18px;overflow:hidden;color:#202327}.control{display:grid;gap:12px}.control label{font:600 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}input[type=range]{width:100%;accent-color:var(--amber)}select,input[type=search],textarea{width:100%;background:var(--panel);border:1px solid var(--rule);border-radius:12px;color:var(--ink);padding:13px 14px;outline:none}textarea{min-height:120px;resize:vertical}.stage.separation{background:linear-gradient(90deg,#34363a 0 30%,#4f6983 30% 70%,#d8d3c7 70%)}.stage.separation .subject{position:absolute;width:110px;height:150px;border-radius:55% 55% 20% 20%;background:#e3e0d8;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 20px 40px #0003}.stage.separation .halo{position:absolute;inset:0;transition:.2s}.stage.light{background:radial-gradient(circle at var(--lx,30%) var(--ly,30%),#fff9,transparent 12%),linear-gradient(#7e95b4,#ddd9d0 60%,#44484d)}.stage.light .subject{position:absolute;left:50%;top:50%;width:120px;height:150px;transform:translate(-50%,-50%);border-radius:60px 60px 20px 20px;background:linear-gradient(90deg,#1d2023,#6c6f72,#24272a)}.stage.light .shadow{position:absolute;left:50%;top:65%;width:180px;height:35px;transform:translateX(-50%);background:#0005;border-radius:50%;filter:blur(10px)}.stage.frame{background:linear-gradient(#8ba1bf 0 40%,#b9b6ae 40% 100%)}.stage.frame .fg{position:absolute;left:0;bottom:0;width:28%;height:70%;background:#2a2d31;transition:.2s}.stage.frame .subj{position:absolute;width:90px;height:125px;background:#25282b;border-radius:45px 45px 18px 18px;transition:.2s}.stage.frame .bgshape{position:absolute;right:8%;top:22%;width:30%;height:35%;background:#9da0a4;opacity:.8}.stage.hist{background:#e9e7e1;display:flex;align-items:end;padding:30px;gap:2px}.bar{flex:1;background:#4a4d51;border-radius:5px 5px 0 0}.stage.curve{background:#e9e7e1;padding:30px}.stage.curve svg{width:100%;height:100%}.timeline{display:grid;gap:10px}.timeline-item{display:grid;grid-template-columns:42px 1fr;gap:12px;align-items:start}.timeline-item .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:600 11px var(--sans);color:#202327}.timeline-item .line{border-left:1px solid var(--rule);min-height:55px;padding:0 0 20px 18px}.terrain-shell{max-width:720px;margin:auto}.terrain-step{display:none}.terrain-step.active{display:block}.big-actions{display:grid;gap:12px}.big-action{padding:20px;border-radius:18px;border:1px solid var(--rule);background:var(--panel);text-align:left}.big-action strong{font-size:23px}.big-action span{display:block;color:var(--muted);margin-top:5px}.result{border-left:4px solid var(--amber);padding:18px;background:var(--panel);border-radius:0 16px 16px 0}.searchbox{position:sticky;top:68px;z-index:10;background:rgba(32,35,39,.92);backdrop-filter:blur(12px);padding:12px 0}.results{display:grid;gap:8px;margin-top:18px}.result-row{display:grid;grid-template-columns:100px 1fr auto;gap:12px;align-items:center;border-top:1px solid var(--rule);padding:14px 4px}.result-row .kind{font:600 10px var(--sans);letter-spacing:.1em;color:var(--muted)}.result-row button{border:0;background:none;text-align:left}.source-chip{font:10px var(--sans);letter-spacing:.08em;color:var(--blue)}.modal{position:fixed;z-index:70;inset:0;background:#101214d9;display:none;align-items:end;justify-content:center}.modal.open{display:flex}.sheet{width:min(980px,100%);max-height:92svh;overflow:auto;background:#24272b;border:1px solid var(--rule);border-radius:28px 28px 0 0;padding:26px;box-shadow:0 -30px 100px #0008}.sheet h2{font-size:44px}.sheet .close{position:sticky;top:0;float:right;border:1px solid var(--rule);border-radius:999px;background:#202327;padding:9px 12px;font:600 10px var(--sans)}.legend{display:flex;gap:14px;flex-wrap:wrap;font:600 10px var(--sans);letter-spacing:.1em;color:var(--muted)}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}.footer{padding-top:50px;padding-bottom:100px;color:var(--muted);font-size:14px}.footer a{color:var(--ink)}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;background:#f0eee9;color:#202327;padding:10px 14px;border-radius:999px;font:600 11px var(--sans);z-index:100;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.reveal{opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s ease}.reveal.in{opacity:1;transform:none}.muted{color:var(--muted)}.accent-amber{color:var(--amber)}.accent-red{color:var(--red)}.accent-green{color:var(--green)}.accent-blue{color:var(--blue)}.center{text-align:center}.small{font-size:14px}.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{font-size:clamp(48px,8vw,90px);letter-spacing:-.06em}.stat-label{font:600 10px var(--sans);letter-spacing:.12em;color:var(--muted)}.trace-row{display:grid;grid-template-columns:60px 70px 1fr 120px;gap:12px;padding:12px 0;border-top:1px solid var(--rule);font-size:14px}.trace-row b{font:600 10px var(--sans);letter-spacing:.1em}.badge{font:600 10px var(--sans);padding:5px 8px;border-radius:999px;background:var(--panel2)}
@media(max-width:800px){.hero-grid,.lab,.split,.grid-2{grid-template-columns:1fr}.hero-art{min-height:350px}.street{width:100%}.cards,.grid-3{grid-template-columns:1fr}.node-grid{grid-template-columns:1fr 1fr}.section{padding-top:90px;padding-bottom:75px}h1{font-size:70px}.cycle{max-width:520px}.cycle-node{font-size:8px;padding:7px 9px}.result-row{grid-template-columns:72px 1fr}.result-row .source-chip{display:none}.trace-row{grid-template-columns:42px 55px 1fr}.trace-row span:last-child{display:none}.sheet h2{font-size:38px}.stage{min-height:310px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.reveal{transition:none}.card:hover{transform:none}.drawer{transition:none}}


/* AURORA VIII · MOBILE READING PASS
   Prevent horizontal clipping and keep every editorial block readable on iPhone. */
html, body { width:100%; max-width:100%; overflow-x:hidden; }
#app, main { width:100%; max-width:100%; min-width:0; overflow-x:hidden; }
.section { width:100%; max-width:100%; min-width:0; }
.hero-grid, .hero-grid > *, .split > *, .lab > *, .grid-2 > * { min-width:0; max-width:100%; }
h1, h2, h3, p, .lede, .micro, .eyebrow { max-width:100%; overflow-wrap:anywhere; }
.pillrow { max-width:100%; display:flex; flex-wrap:wrap; align-items:center; }
.pill { white-space:normal; max-width:100%; }
.street { max-width:100%; }

@media (max-width: 800px) {
  .topbar {
    height:58px;
    padding:0 16px;
  }
  .wordmark { font-size:11px; letter-spacing:.28em; }
  .menu { padding:8px 12px; }

  .section {
    padding-left:18px;
    padding-right:18px;
  }

  .hero {
    min-height:auto;
    padding-top:92px;
    padding-bottom:56px;
  }

  .hero-grid {
    display:block;
  }

  .hero-grid > :first-child {
    width:100%;
  }

  h1 {
    font-size:clamp(44px, 13.2vw, 66px);
    line-height:.9;
    letter-spacing:-.045em;
    margin:14px 0 22px;
    overflow-wrap:normal;
    word-break:normal;
  }

  h2 {
    font-size:clamp(38px, 10.5vw, 56px);
    line-height:.94;
  }

  h3 { font-size:24px; }

  .lede {
    font-size:clamp(18px, 5vw, 23px);
    line-height:1.28;
  }

  .eyebrow {
    font-size:9px;
    letter-spacing:.22em;
    line-height:1.45;
  }

  .micro {
    font-size:9px;
    line-height:1.55;
    letter-spacing:.09em;
  }

  .pillrow {
    gap:7px;
    margin:22px 0;
  }

  .pill {
    font-size:9px;
    letter-spacing:.07em;
    padding:8px 11px;
  }

  .hero-art {
    min-height:0;
    margin-top:34px;
    padding-bottom:8px;
  }

  .street {
    width:min(100%, 430px);
    border-radius:20px;
  }

  .scroll-note {
    position:static;
    margin-top:12px;
    text-align:center;
  }

  .node-grid { grid-template-columns:1fr 1fr; }
  .node { padding:15px; min-width:0; }
  .node strong { font-size:18px; line-height:1.08; overflow-wrap:anywhere; }

  .interactive, .lab { min-width:0; }
  .interactive { padding:16px; border-radius:20px; }
  .stage { min-height:270px; max-width:100%; }
  .control { min-width:0; }

  .cycle {
    width:100%;
    max-width:430px;
    margin-left:auto;
    margin-right:auto;
  }

  .cycle-node {
    font-size:7px;
    padding:6px 8px;
    max-width:30%;
    white-space:normal;
    text-align:center;
  }

  .drawer {
    width:min(340px, 88vw);
    padding:22px;
  }
  .drawer nav a { font-size:23px; }

  .result-row, .trace-row {
    min-width:0;
    max-width:100%;
  }
  .result-row > *, .trace-row > * { min-width:0; }
}

let DATA=null, TRACE=null;
const EMBEDDED_DATA={"cards":[{"id":"S01","fam":"situation","num":"01","title":"La pluie","intent":"Faire travailler le sol comme seconde source de lumière.","key":"Le sol double toutes les sources lumineuses de la ville.","blocks":[["Décisions sur place","list",["Le sol mouillé juste après l'averse, avant qu'il sèche.","Les flaques : descendez au ras de l'eau, le reflet grandit.","Les parapluies : des formes simples, colorées, qui se détachent.","Les vitres couvertes de gouttes, à photographier au travers."]],["Configuration actuelle — iPhone 17 Pro","kv",[["Objectif","1× (24 mm). Le 2× si vous restez à l'abri d'un porche"],["Format","ProRAW. Les hautes lumières des reflets se récupèrent"],["Exposition","− 0,7 EV : les reflets brillent, ne les brûlez pas"],["Mode Nuit","Désactivé si les gens marchent"],["Protection","Aucune nécessaire, mais essuyez l'objectif souvent"]]],["Ensuite, dans Lightroom","text","Baissez d'abord les hautes lumières pour retrouver les reflets, puis remontez le noir : une image de pluie doit rester profonde. Évitez tout preset qui réchauffe — la pluie est froide, c'est son sujet."]],"note":"Les gouttes sur l'objectif créent des halos que le traitement automatique interprète comme du flou et tente de corriger. Essuyez avant chaque prise plutôt que de corriger après.","q":["Q03","Q10"],"kw":"pluie mouille averse flaque parapluie reflet sol orage"},{"id":"S02","fam":"situation","num":"02","title":"Le brouillard","intent":"Rendre la profondeur lisible sans rien ajouter au cadre.","key":"Il sépare les plans gratuitement : plus c'est loin, plus c'est pâle.","blocks":[["Décisions sur place","list",["Un sujet sombre proche : c'est lui qui donnera l'échelle du blanc.","Des rangées d'objets identiques qui s'éloignent — arbres, poteaux, arches.","Les sources lumineuses : elles deviennent des halos.","Ne cherchez pas le détail. Cherchez la silhouette."]],["Configuration actuelle — iPhone 17 Pro","kv",[["Objectif","2× (48 mm) ou 4× (100 mm) : la longue focale empile les plans"],["Format","ProRAW impérativement — le brouillard est fragile"],["Exposition","+ 0,3 à + 0,7 EV : sinon l'automatisme le rend gris"],["Mise au point","Touchez le sujet proche ; l'autofocus se perd dans le blanc"],["HDR","Le traitement cherche à percer la brume. Le ProRAW le limite"]]],["Ensuite, dans Lightroom","text","Ne remontez jamais le contraste global : vous détruiriez l'effet. Travaillez uniquement le sujet proche — un peu de noir, un peu de clarté locale — et laissez le fond laiteux."]],"note":"L'appareil considère une scène blanche comme surexposée et l'assombrit systématiquement. Avec la neige, c'est la seule situation où il faut surexposer volontairement.","q":["Q05","Q08"],"kw":"brouillard brume laiteux plans blanc profondeur"},{"id":"S03","fam":"situation","num":"03","title":"Les néons et les vitrines","intent":"Laisser la lumière choisir le sujet, et protéger les sources.","key":"Le noir doit rester noir. Sous-exposez franchement.","blocks":[["Décisions sur place","list",["Une flaque de lumière au sol, et attendez que quelqu'un y entre.","Les vitrines : elles éclairent les passants comme un studio.","Une seule couleur dominante par image. Deux néons opposés se neutralisent.","Les visages éclairés par le bas : dramatique, souvent trop. Préférez de côté."]],["Configuration actuelle — iPhone 17 Pro","kv",[["Objectif","1× exclusivement. Les autres capteurs décrochent la nuit"],["Format","ProRAW 12 Mpx. Le 48 Mpx n'apporte rien sans lumière"],["Exposition","− 1,0 à − 2,0 EV, mesure sur l'enseigne"],["Mode Nuit","Désactivé dès qu'un passant bouge"],["Tenue","Adossé à un mur, coudes serrés, expirez avant de déclencher"]]],["Ensuite, dans Lightroom","text","Ne remontez pas l'exposition globale : travaillez les ombres seules. Attention aux verts et magentas des LED, qui virent sur les peaux — corrigez-les en teinte ciblée plutôt qu'en balance des blancs globale."]],"note":"Les enseignes saturées brûlent avant tout le reste, et une enseigne brûlée devient un aplat blanc sans couleur. C'est irrécupérable, même en ProRAW.","q":["Q03","Q10"],"kw":"neon nuit vitrine enseigne led sombre urbain noir"},{"id":"S04","fam":"situation","num":"04","title":"Le café, l'intérieur","intent":"Obtenir une lumière douce et directionnelle sans matériel.","key":"Une fenêtre est une source large et proche : la lumière la plus douce qui existe.","blocks":[["Décisions sur place","list",["La table la plus proche de la fenêtre, jamais celle du fond.","Le sujet de trois quarts par rapport à la vitre, pas face à elle.","Un mur clair en face : il renvoie la lumière et ouvre les ombres.","Photographiez à travers l'encadrement, depuis l'extérieur : la vitre ajoute un reflet."]],["Configuration actuelle — iPhone 17 Pro","kv",[["Objectif","2× (48 mm) : proportions naturelles du visage"],["Format","ProRAW Max en 1×, ProRAW 12 Mpx en 2×"],["Exposition","Mesure sur le visage, puis − 0,3 EV"],["À éviter","Le 0,5× à moins d'un mètre : il déforme les traits"],["Mode Portrait","Incompatible ProRAW. Préférez le 2× et le vrai recul"]]],["Ensuite, dans Lightroom","text","Une lumière de fenêtre demande très peu : un peu de blancs, un peu de noirs, et surtout ne touchez pas à la saturation des peaux. C'est aussi une situation où ne pas utiliser de preset est souvent le meilleur choix."]],"note":"Placez le sujet à un mètre de la fenêtre, pas au fond de la salle : la douceur d'une source vient de sa proximité autant que de sa taille.","q":["Q03","Q08"],"kw":"cafe interieur fenetre restaurant table portrait doux"},{"id":"S05","fam":"situation","num":"05","title":"L'architecture","intent":"Décider d'une géométrie : parallèle ou franchement fuyante.","key":"Téléphone parfaitement vertical, ou franchement incliné. Jamais entre les deux.","blocks":[["Décisions sur place","list",["Reculez et tenez le téléphone vertical, quitte à couper le sommet.","Ou assumez franchement : plaquez-vous au pied et regardez droit en l'air.","Un seul point de fuite : placez-vous dans l'axe, ou franchement de biais.","La lumière rasante du matin ou du soir révèle le relief des façades."]],["Configuration actuelle — iPhone 17 Pro","kv",[["Objectif","1× pour l'ensemble, 4× (100 mm) pour aplatir une façade"],["Niveau","Grille activée : le réticule apparaît à l'horizontale"],["À éviter","Le 0,5× : il exagère la fuite des verticales"],["Format","ProRAW Max — il reste de la marge pour redresser"],["Exposition","Mesure sur la façade éclairée, − 0,3 EV"]]],["Ensuite, dans Lightroom","text","Redressez d'abord, recadrez ensuite, développez en dernier. Le redressement coûte des pixels sur les bords : c'est pourquoi le 48 Mpx est utile ici, et pourquoi il faut cadrer un peu large."]],"note":"Le grand-angle du 0,5× applique une correction de distorsion logicielle qui étire les coins. Sur une façade régulière, cela se voit. Préférez reculer en 1×.","q":["Q06","Q07"],"kw":"architecture batiment facade verticale penche immeuble"},{"id":"S06","fam":"situation","num":"06","title":"Le métro, les souterrains","intent":"Renoncer aux visages, exploiter la géométrie.","key":"Mauvaise lumière pour les visages, excellente géométrie.","blocks":[["Décisions sur place","list",["Les couloirs en enfilade et les escalators : lignes de fuite parfaites.","Le quai vide juste après le départ d'une rame.","Le contre-jour d'une sortie : les gens deviennent des silhouettes.","Les fenêtres de rame en mouvement : la couleur file, la personne reste."]],["Configuration actuelle — iPhone 17 Pro","kv",[["Objectif","1×. Le 0,5× seulement dans un couloir vraiment étroit"],["Format","ProRAW 12 Mpx"],["Exposition","− 0,7 EV et verrouillage AE/AF : la lumière change à chaque pas"],["Mode Nuit","Désactivé — il y a assez de lumière et tout bouge"],["Rafale","Oui, au moment où quelqu'un traverse le cadre"]]],["Ensuite, dans Lightroom","text","Les néons de métro sont souvent verts : c'est le cas type où corriger la teinte plutôt que la température. Ensuite, le noir et blanc résout beaucoup de problèmes ici."]],"note":"Photographier dans le métro est réglementé selon les villes et les réseaux, et le pied y est presque toujours interdit. Renseignez-vous avant, en particulier à l'étranger.","q":["Q07","Q09"],"kw":"metro souterrain couloir quai tunnel escalator"},{"id":"S07","fam":"situation","num":"07","title":"Les reflets","intent":"Montrer ensemble deux choses qui ne tiennent pas dans un cadre.","key":"Deux images pour le prix d'une. L'axe doit tomber au milieu exact.","blocks":[["Décisions sur place","list",["Descendez : plus l'appareil est bas, plus la surface réfléchissante est grande.","Une flaque de trente centimètres suffit à contenir un immeuble entier.","Dans une vitrine, cherchez la superposition : ce qui est dedans et ce qui est derrière vous.","Le reflet est toujours plus sombre que la scène : mesurez sur lui, pas sur le ciel."]],["Configuration actuelle — iPhone 17 Pro","kv",[["Objectif","1×. Posez le téléphone au ras du sol, écran vers vous"],["Cadrage","Grille activée : l'axe de symétrie doit tomber au milieu"],["Exposition","Mesure sur le reflet, puis − 0,3 EV pour tenir le ciel"],["Format","ProRAW Max : l'écart entre reflet et ciel est important"]]],["Ensuite, dans Lightroom","text","Un reflet demande souvent deux traitements différents : le haut et le bas de l'image ne vivent pas dans la même lumière. Utilisez un dégradé linéaire plutôt qu'un réglage global, puis appliquez le preset par-dessus."]],"note":"Une ride suffit à casser un miroir. Cherchez le calme, ou assumez franchement la surface brisée — l'entre-deux ne fonctionne pas.","q":["Q06","Q10"],"kw":"reflet flaque miroir vitrine symetrie eau canal"},{"id":"S08","fam":"situation","num":"08","title":"Le portrait dans la rue","intent":"Séparer une personne de son décor et ouvrir son regard.","key":"Lumière douce, longue focale, fond éloigné. Les trois se règlent avec les pieds.","blocks":[["Décisions sur place","list",["Une lumière douce : à l'ombre d'un mur, sous un porche, par ciel couvert.","Un fond loin derrière la personne — jamais collé à elle.","Le regard vers la source de lumière : les yeux s'allument.","Une lumière de côté, jamais dans le dos du sujet en plein soleil."]],["Configuration actuelle — iPhone 17 Pro","kv",[["Objectif","2× (48 mm) au minimum, 4× (100 mm) idéalement"],["À éviter","Le 1× à moins d'un mètre : nez élargi, oreilles rétrécies"],["Format","ProRAW. Le mode Portrait est incompatible avec lui"],["Mise au point","Appui long sur l'œil, puis recadrez"],["Exposition","Mesure sur le visage, − 0,3 EV si le fond est clair"]]],["Ensuite, dans Lightroom","text","Ne touchez jamais à la saturation globale sur un portrait : elle attaque les peaux avant tout le reste. Travaillez en TSL sur les oranges seulement. Sur une peau très claire, réduisez systématiquement l'intensité du preset."]],"note":"Le flou d'arrière-plan du mode Portrait est calculé, pas optique : il se trompe sur les cheveux et les lunettes. Un vrai 4× à trois mètres donne un flou plus crédible, sans artefact.","q":["Q02","Q08"],"kw":"portrait visage personne peau modele rue flou arriere plan"},{"id":"S09","fam":"situation","num":"09","title":"Le marché, la foule","intent":"Extraire un seul sujet d'un désordre saturé.","key":"La seule stratégie qui fonctionne est soustractive : choisir un élément, éliminer le reste.","blocks":[["Décisions sur place","list",["Un étal d'une seule couleur : il devient un fond, pas un sujet.","Les mains : elles racontent le marché mieux que les visages.","Un auvent ou une bâche : la lumière qui passe au travers se colore.","Restez à un endroit et laissez la foule composer devant vous."]],["Configuration actuelle — iPhone 17 Pro","kv",[["Objectif","2× (48 mm) pour isoler, 1× pour l'ambiance générale"],["Format","ProRAW Max en 1× ; 12 Mpx suffit en 2×"],["Rafale","Indispensable : les gestes durent un dixième de seconde"],["Exposition","Verrouillez AE/AF sur l'étal, la lumière varie beaucoup"],["Discrétion","Écran à hauteur de poitrine plutôt qu'à hauteur d'œil"]]],["Ensuite, dans Lightroom","text","Résistez à la saturation : un marché est déjà saturé. Le meilleur développement est souvent une désaturation partielle, sauf sur une couleur qu'on garde."]],"note":"Photographier des personnes reconnaissables engage leur droit à l'image, et les règles varient d'un pays à l'autre. Dans le doute, montrez l'image, souriez, proposez de l'effacer.","q":["Q02","Q07"],"kw":"marche foule gens etal bruit couleurs monde"},{"id":"S10","fam":"situation","num":"10","title":"Le point de vue élevé","intent":"Transformer une ville traversée en surface lisible.","key":"La ville cesse d'être un décor traversé et devient une surface.","blocks":[["Décisions sur place","list",["Le moment où le soleil rase les toits : les ombres dessinent la ville.","Un premier plan proche — rambarde, angle de mur — pour donner l'échelle.","Une rue en enfilade, vue de haut : les gens deviennent des points.","L'heure bleue : les fenêtres s'allument et la ville devient une constellation."]],["Configuration actuelle — iPhone 17 Pro","kv",[["Objectif","4× (100 mm) pour empiler, 1× pour l'ensemble"],["Format","ProRAW Max en 1× : les détails lointains comptent"],["Stabilité","Posez sur la rambarde. En 4×, le moindre tremblement se voit"],["Exposition","− 0,7 EV si le ciel est dans le cadre"],["À éviter","Le 0,5× : il rapetisse tout et vide l'image"]]],["Ensuite, dans Lightroom","text","Les vues lointaines demandent presque toujours un peu de voile à retirer, mais très peu : un ciel de ville trop nettoyé devient artificiel. Réduisez le contraste du preset si l'air est brumeux."]],"note":"Photographier à travers une vitre depuis un observatoire produit reflets et voile. Collez l'objectif contre le verre, main en visière autour, et coupez le mode Nuit qui accentue les halos.","q":["Q05","Q08"],"kw":"toit vue elevee pont panorama hauteur ville"},{"id":"S11","fam":"situation","num":"11","title":"La neige","intent":"Contredire la mesure et garder de la matière dans le blanc.","key":"La seule situation où il faut surexposer. + 1 EV, sinon la neige devient grise.","blocks":[["Décisions sur place","list",["Un sujet sombre : sans lui, l'image n'a aucun point d'ancrage.","La neige qui tombe : elle n'est visible que sur un fond sombre.","Les traces de pas, les branches chargées, les toits — la texture du blanc.","Juste après la chute, avant que la ville la salisse."]],["Configuration actuelle — iPhone 17 Pro","kv",[["Exposition","+ 0,7 à + 1,3 EV. C'est la situation inverse de toutes les autres"],["Objectif","1× ou 2×"],["Format","ProRAW : le blanc est à un cheveu de la brûlure"],["Balance","La neige à l'ombre est franchement bleue. C'est vrai, pas un défaut"],["Batterie","Le froid la vide en quelques minutes. Gardez le téléphone contre vous"]]],["Ensuite, dans Lightroom","text","Décidez si votre neige est blanche ou bleue, et assumez : les deux sont justes, l'entre-deux ne l'est pas. Vérifiez qu'il reste du détail dans le blanc avant d'appliquer un preset."]],"note":"Sous les flocons, l'autofocus accroche la neige au lieu du sujet. Appui long sur le sujet pour verrouiller la mise au point avant de déclencher.","q":["Q10"],"kw":"neige hiver blanc froid flocon"},{"id":"S12","fam":"situation","num":"12","title":"Midi, la lumière que tout le monde fuit","intent":"Faire de l'ombre portée le sujet plutôt que le problème.","key":"Elle creuse les visages — mais elle est la seule à dessiner des ombres franches.","blocks":[["Décisions sur place","list",["Les ombres portées comme motif : grilles, feuillages, passages piétons.","L'architecture géométrique et les contrastes francs.","Le côté ombragé de la rue : une lumière douce, réfléchie par la façade d'en face.","Les intérieurs : une fenêtre à midi est une des plus belles lumières qui soient."]],["Configuration actuelle — iPhone 17 Pro","kv",[["Objectif","1× pour l'ensemble, 4× pour isoler un motif d'ombre"],["Exposition","Verrouillez sur la zone claire, puis − 0,5 EV environ"],["Format","ProRAW : l'écart entre soleil et ombre est maximal"],["Geste","Baissez l'appareil vers le sol et inclinez-le : l'ombre devient motif"]]],["Ensuite, dans Lightroom","text","Le noir et blanc résout beaucoup de choses à midi. Si vous gardez la couleur, descendez les ombres plutôt que de les ouvrir : la dureté est le sujet."]],"note":"Un ciel de midi brûlé ne se récupère pas, même en ProRAW ; une ombre bouchée, si. À éviter : les visages en plein soleil, les paysages sans relief, tout ce qui repose sur la douceur.","q":["Q04","Q09"],"kw":"midi soleil plein dur ombre portee contraste chaud"},{"id":"Y01","fam":"symptome","num":"01","title":"L'image entière","intent":"","key":"Quand la gêne porte sur la photographie dans son ensemble.","blocks":[["","sym",[["« Ça manque de relief »","Lumière frontale, ou un seul plan de profondeur.","Cherchez la direction des ombres, puis faites entrer un élément proche dans le cadre.","10 · 12"],["« C'est fade, sans force »","Contraste réel faible, souvent un ciel couvert.","Ce n'est pas un défaut du fichier. Le contraste se remet au développement, pas à la prise de vue.","19 · 46"],["« Ça fait photo de téléphone »","Prise à hauteur d'œil, debout, en 1×, au milieu de la journée.","Changez une seule variable : baissez-vous, ou passez en 2×, ou revenez une heure plus tard.","26 · 59"],["« C'est encombré »","Plusieurs sujets d'égale force.","Retirez plutôt qu'ajouter : un pas de côté, un resserrement, l'attente que quelqu'un sorte.","12 · 13"],["« L'image paraît penchée »","Verticales convergentes ou horizon non aligné.","Activez la grille et le niveau. Une inclinaison se corrige au recadrage, mais au prix des bords.","41 · 23"],["« Elle ne raconte rien »","Cadrage descriptif, sans point de vue.","Demandez-vous ce que vous voulez montrer : le sujet dans son espace, ou contre son décor.","27 · 08"]]]],"note":"Presque aucune de ces gênes ne se répare après coup. Elles se décident au moment où vous choisissez où poser vos pieds. Les numéros renvoient au Livre.","q":["Q01","Q05"],"kw":"plat fade relief encombre penche global raconte rien banal"},{"id":"Y02","fam":"symptome","num":"02","title":"Le sujet","intent":"","key":"Quand quelque chose empêche le regard d'arriver là où il devrait.","blocks":[["","sym",[["« Mon sujet se perd dans le décor »","Aucune séparation entre le sujet et son fond.","Il en faut une des quatre : ton, couleur, netteté ou bord. Changez de place, pas de réglage.","09 · 12"],["« Il paraît trop petit »","Trop loin, ou focale trop courte.","Rapprochez-vous. Si c'est impossible, passez en 2× ou 4× — mais le fond changera aussi.","27 · 59"],["« Quelque chose sort de sa tête »","Poteau, antenne ou branche à l'arrière-plan.","Un pas de côté suffit presque toujours. Regardez le contour du crâne avant de déclencher.","12 · 24"],["« Il est coupé bizarrement »","Découpe tombée sur une articulation.","Ne coupez jamais au cou, au coude, au poignet, au genou ou à la cheville. Coupez entre deux.","25"],["« Il est collé au bord »","Espace laissé du mauvais côté.","Laissez le vide du côté où le sujet regarde ou avance, jamais derrière lui.","28 · 32"],["« J'ai raté l'instant »","Réglages faits pendant l'action, pas avant.","Choisissez le lieu, verrouillez l'exposition, puis attendez. Rafale au moment d'entrer.","40 · 20"]]]],"note":"Presque aucune de ces gênes ne se répare après coup. Elles se décident au moment où vous choisissez où poser vos pieds. Les numéros renvoient au Livre.","q":["Q02","Q06"],"kw":"sujet perd petit poteau coupe bord instant rate tete"},{"id":"Y03","fam":"symptome","num":"03","title":"Lumière et couleur","intent":"","key":"Quand la matière même de l'image ne va pas.","blocks":[["","sym",[["« Le ciel est tout blanc »","Hautes lumières brûlées, définitivement.","Exposez pour la zone claire et laissez tomber les ombres. Ou excluez le ciel du cadre.","38 · 39"],["« C'est trop sombre et ça grésille »","Sous-exposition en basse lumière.","Restez en 1×, le seul capteur qui tient la nuit. Une image nette et bruitée vaut mieux qu'une image propre et molle.","59 · 61"],["« C'est flou »","Temps de pose long, ou mode Nuit sur un sujet qui bouge.","Adossez-vous, coudes serrés, expirez. Désactivez le mode Nuit dès que quelque chose bouge.","61"],["« Les visages sont gris et froids »","Sujet à l'ombre, éclairé seulement par le ciel.","Ce n'est pas un défaut : la lumière est réellement bleue. Réchauffez au développement, ou cherchez un mur clair.","18 · 49"],["« Ça a l'air trop HDR, artificiel »","Le traitement automatique a débouché les ombres.","Passez en ProRAW : la correction est réduite. Puis abaissez les ombres au développement.","60 · 46"],["« Les couleurs partent dans tous les sens »","Trop de teintes saturées d'égale force.","Cherchez un fond uni ou une ombre. Une seule couleur isolée attire plus que cinq.","12 · 50"]]]],"note":"Presque aucune de ces gênes ne se répare après coup. Elles se décident au moment où vous choisissez où poser vos pieds. Les numéros renvoient au Livre.","q":["Q03","Q10"],"kw":"ciel blanc brule sombre bruit flou gris froid hdr couleurs"},{"id":"Y04","fam":"symptome","num":"04","title":"Les situations","intent":"","key":"Quand c'est le lieu ou la météo qui pose problème.","blocks":[["","sym",[["« Ma photo de nuit est floue »","Pose trop longue, ou mode Nuit sur un sujet qui bouge.","Coupez le mode Nuit dès que quelqu'un marche, adossez-vous, expirez avant de déclencher.","SIT 03"],["« Les néons sont complètement brûlés »","Mesure faite sur l'ombre, pas sur l'enseigne.","Une enseigne brûlée devient un aplat blanc sans couleur, irrécupérable. Sous-exposez de 1 à 2 EV.","SIT 03"],["« Ma neige est grise »","L'automatisme cherche un gris moyen devant une scène blanche.","C'est la seule situation où il faut surexposer : + 0,7 à + 1,3 EV.","SIT 11"],["« Mon architecture penche »","Téléphone incliné vers le haut : les verticales convergent.","Reculez et tenez l'appareil vertical, quitte à couper le sommet. Le 0,5× aggrave tout.","SIT 05"],["« Mon portrait paraît plat »","Lumière frontale, ou fond collé au sujet.","Lumière de côté, fond éloigné, 2× minimum. Aucun réglage ne remplace ces trois gestes.","SIT 08"],["« Le brouillard est devenu gris »","L'appareil a assombri une scène blanche.","Surexposez de 0,3 à 0,7 EV, et surtout ne remontez pas le contraste au développement.","SIT 02"]]]],"note":"Presque aucune de ces gênes ne se répare après coup. Elles se décident au moment où vous choisissez où poser vos pieds. Les numéros renvoient au Livre.","q":["Q09","Q10"],"kw":"nuit floue neon brule neige grise architecture penche portrait plat"},{"id":"Y05","fam":"symptome","num":"05","title":"Le développement","intent":"","key":"Quand le problème apparaît devant l'écran, et non sur le terrain.","blocks":[["","sym",[["« Ma photo paraît trop traitée »","Preset à pleine intensité, ou ombres et hautes lumières poussées à fond.","Baissez l'intensité à 60-70 %. Une image qui a perdu son noir et son blanc paraît toujours artificielle.","52 · 46"],["« Les couleurs sont trop agressives »","Saturation globale au lieu de vibrance ou de TSL.","Revenez à zéro, montez la vibrance, puis n'ajustez que le canal concerné.","50"],["« Les visages tirent vers l'orange »","Le canal orange du TSL est saturé par le preset.","Baissez la saturation des oranges de 10 à 20. Jamais la saturation globale.","50 · 52"],["« Le ciel est gris alors qu'il était magnifique »","Hautes lumières écrêtées à la prise de vue.","Rien à récupérer : le fichier est vide à cet endroit. Cela se corrige à la prise de vue, à − 0,7 EV.","48 · 39"],["« Mon image est plate après développement »","Ombres ouvertes et hautes lumières fermées à fond.","Réancrez : descendez les noirs jusqu'à retrouver un vrai point sombre.","46 · 48"],["« Je passe une heure et le résultat empire »","Trop de retouches successives sans repos.","Quatre minutes, puis on ferme. Rouvrez le lendemain : ce qui saute aux yeux est le seul vrai défaut.","53"]]]],"note":"Presque aucune de ces gênes ne se répare après coup. Elles se décident au moment où vous choisissez où poser vos pieds. Les numéros renvoient au Livre.","q":["Q12"],"kw":"traite preset saturation orange peau plate developpement"},{"id":"G01","fam":"geste","num":"01","title":"La chaîne de décision","intent":"","key":"L'intention d'abord, le réglage en dernier. Cet ordre ne change jamais.","blocks":[["","steps",[["Intention","Que voulez-vous montrer ? Une phrase, sans aucun nombre dedans."],["Décision photographique","Quelle séparation, quelle perspective, quel moment ?"],["Contrainte de la scène","Où pouvez-vous vous placer ? Quelle lumière est réellement disponible ?"],["Outil disponible","Quel angle de champ, quelle distance de travail, quelle latitude de fichier ?"],["Réglage","Et seulement maintenant, la commande précise sur l'appareil que vous tenez."]]]],"note":"Si la première phrase que vous vous dites contient un nombre, vous avez commencé par l'étape 5. Revenez à l'étape 1.","q":["Q02","Q11"],"kw":"chaine decision intention reglage ordre"},{"id":"G02","fam":"geste","num":"02","title":"Les trente secondes avant de déclencher","intent":"","key":"Dans cet ordre. Chaque étape prend cinq secondes.","blocks":[["","steps",[["Lumière — Q03","D'où viennent les ombres ? Placez-les en travers du sujet."],["Sujet — Q02","Un seul. Lequel ? Si vous hésitez, le spectateur hésitera."],["Fond — Q07","Regardez derrière. Zone brûlée, poteau, second sujet."],["Plans — Q05","Y a-t-il un premier plan ? Sinon, faites un pas de côté."],["Bords — Q07","Faites le tour du cadre du regard. Rien ne doit être coupé à moitié."],["Hauteur — Q06","Baissez-vous ou montez. La hauteur d'œil est le choix le plus banal."]]]],"note":"Puis déclenchez trois fois : une à hauteur d'œil, une plus bas, une plus près. Vous choisirez ce soir.","q":["Q01","Q03","Q07"],"kw":"avant declencher trente secondes checklist"},{"id":"G03","fam":"geste","num":"03","title":"Trouver la lumière en trente secondes","intent":"","key":"Avant même de sortir l'appareil.","blocks":[["","steps",[["Levez les yeux","Où est la zone la plus claire du ciel ? Tout part de là."],["Baissez les yeux","Bord d'ombre net ou flou ? Vous savez si la lumière est dure."],["Tournez sur vous-même","Repérez le côté de rue éclairé et le côté à l'ombre."],["Choisissez un mur","Celui qui reçoit la lumière : c'est votre réflecteur."],["Placez-vous","Vous êtes maintenant du bon côté de la scène."],["Puis seulement, cadrez","La lumière d'abord. Le sujet ensuite."]]]],"note":"Si aucune lumière ne vous convainc en trente secondes, ne forcez pas. Marchez cinq minutes et recommencez.","q":["Q03"],"kw":"trouver lumiere arriver sur place"},{"id":"G04","fam":"geste","num":"04","title":"Le tour du cadre en dix secondes","intent":"","key":"Toujours dans le même sens. Le geste doit devenir automatique.","blocks":[["","steps",[["Haut","Une zone claire s'échappe-t-elle par le bord ? Un objet coupé ?"],["Droite","Quelque chose entre-t-il à moitié dans le cadre ?"],["Bas","Le sujet est-il coupé sur une articulation ? Les pieds y sont-ils ?"],["Gauche","Un élément parasite plus contrasté que le sujet ?"],["Horizon","Est-il droit ?"],["Hauteur","Avant de valider : essayez une fois plus bas."]]]],"note":"Ce tour coûte dix secondes. Il vous épargnera la moitié des images que vous auriez supprimées le soir.","q":["Q07"],"kw":"tour du cadre bords dix secondes verifier"},{"id":"G05","fam":"geste","num":"05","title":"Développer en quatre minutes","intent":"","key":"Une discipline, pas un chronomètre : elle protège de l'acharnement.","blocks":[["","steps",[["Recadrer et redresser","Horizon droit, bords propres.  ·  30 s"],["Exposition","Le sujet à sa place. Rien d'autre.  ·  20 s"],["Hautes lumières, ombres, noirs","Récupérer, puis réancrer.  ·  60 s"],["Préréglage","Celui qui correspond à la lumière que vous aviez.  ·  20 s"],["Les trois gestes","Exposition, peaux, intensité.  ·  60 s"],["Reposer, puis regarder","Fermez, rouvrez. Ce qui saute aux yeux est le vrai défaut.  ·  30 s"]]]],"note":"Une image qu'on retouche pendant une heure finit presque toujours moins bien qu'après quatre minutes.","q":["Q12"],"kw":"developper quatre minutes lightroom retouche soir"},{"id":"G06","fam":"geste","num":"06","title":"La revue du soir","intent":"","key":"Le progrès vient du nombre de fois où l'on a su dire pourquoi.","blocks":[["","steps",[["Quelle est ma meilleure image ?","Une seule. Pas trois."],["Pourquoi celle-là ?","Nommez la raison : la lumière, la séparation, le moment, le cadre. Si vous ne savez pas nommer, c'était de la chance."],["Qu'est-ce qui l'aurait rendue meilleure ?","Un pas de côté, dix centimètres plus bas, deux secondes plus tard."],["Notez-le","Cette réponse devient la contrainte de la prochaine sortie."],["Rouvrez la sélection demain","La moitié tombera. C'est exactement là que se trouve le progrès."]]]],"note":"C'est la seule carte qui ne parle ni de lumière, ni de cadre, ni de réglage. C'est probablement la plus importante.","q":["Q12"],"kw":"revue du soir critique progres meilleure image"}],"intentions":[{"id":"I1","t":"Isoler ce sujet","q":"Q02","ex":"03","decision":"Augmenter l'écart entre le sujet et tout ce qui l'entoure — spatialement d'abord, tonalement ensuite, optiquement en dernier.","gestes":["Éloignez le fond du sujet, ou rapprochez-vous de lui.","Cherchez un fond plus sombre, plus clair ou plus lointain.","Resserrez l'angle de champ pour exclure le désordre.","Attendez que les sujets concurrents sortent du cadre."],"book":[[37,"Séparer un sujet de son monde"],[9,"Quatre façons de détacher un sujet"],[12,"Le fond décide de tout"]],"cards":["S08","S09"]},{"id":"I2","t":"Situer quelqu'un dans un lieu","q":"Q08","ex":"02","decision":"Reculer, élargir, et faire entrer un premier plan pour que le lieu raconte autant que la personne.","gestes":["Reculez physiquement plutôt que d'élargir depuis le même point.","Faites entrer un élément proche dans un coin du cadre.","Placez la personne là où les lignes se rejoignent.","Laissez le vide du côté où elle regarde ou avance."],"book":[[27,"La distance décide de l'histoire"],[10,"Trois distances dans un cadre"],[11,"Les lignes conduisent l'œil"]],"cards":["S10","S05"]},{"id":"I3","t":"Trouver la bonne lumière","q":"Q03","ex":"04","decision":"Lire la source avant de chercher un sujet : direction, dureté, hauteur, couleur. Puis se placer, et attendre.","gestes":["Levez les yeux : où est la zone la plus claire du ciel ?","Regardez un bord d'ombre : net, la lumière est dure ; flou, elle est douce.","Repérez le mur qui reçoit la lumière : c'est votre réflecteur.","Cadrez la zone éclairée vide, et laissez le sujet y entrer."],"book":[[14,"Cinq questions sur la lumière"],[15,"Dure ou douce : la taille apparente"],[17,"Six lumières, six usages"],[20,"Cadrer la lumière, attendre le sujet"]],"cards":["G03","S12","S04"]},{"id":"I4","t":"Attendre le bon moment","q":"Q09","ex":"06","decision":"Choisir un endroit, tout régler à l'avance, puis laisser la scène venir au point préparé.","gestes":["Cadrez la zone vide, exposition verrouillée, angle choisi.","Baissez l'appareil et regardez qui arrive de chaque côté.","Remontez une seconde avant que le sujet atteigne le point.","Rafale seulement si le geste dure moins d'un dixième de seconde."],"book":[[40,"Se placer, puis attendre"],[20,"Cadrer la lumière, attendre le sujet"]],"cards":["G02","S09"]},{"id":"I5","t":"Protéger ce que je vais perdre","q":"Q10","ex":"05","decision":"Nommer la zone critique, exposer pour elle, et laisser le reste tomber. Une ombre se relève, un blanc écrêté ne revient pas.","gestes":["Désignez la zone qui doit garder du détail. Une seule.","Mesurez dessus, verrouillez, puis recomposez.","Corrigez vers le bas jusqu'à ce que les clairs cessent d'être blancs.","Sauf devant du blanc dominant : là, il faut surexposer."],"book":[[38,"Exposer selon l'intention"],[39,"Mesurer, verrouiller, recomposer"],[19,"Ce que le capteur peut avaler"],[62,"Combien assombrir"]],"cards":["S11","S03"]},{"id":"I6","t":"Décider ce que je garde ce soir","q":"Q12","ex":"08","decision":"Trier avant de développer, puis suivre la boucle image · diagnostic · intention · décision · ajustement · vérification.","gestes":["Dix secondes par image : est-ce que je m'arrête dessus ?","Une seule version par scène, comparée côte à côte.","Quatre minutes de développement, puis on ferme.","Rouvrez le lendemain : ce qui saute aux yeux est le vrai défaut."],"book":[[44,"Trier, et jeter"],[45,"Le raisonnement de développement"],[53,"Développer en quatre minutes"],[52,"Ce qu'est réellement un préréglage"]],"cards":["G05","G06","Y05"]}],"book":[[2,"Trois objets, une méthode",[]],[3,"Les six niveaux d'Aurora",[]],[4,"La carte du territoire",[]],[5,"Les douze questions",[]],[6,"La légende permanente",[]],[8,"Où va l'œil",["Q01"]],[9,"Quatre façons de détacher un sujet",["Q01","Q02"]],[10,"Trois distances dans un cadre",["Q05"]],[11,"Les lignes conduisent l'œil",["Q01"]],[12,"Le fond décide de tout",["Q07"]],[13,"Retirer, jamais ajouter",["Q07"]],[14,"Cinq questions sur la lumière",["Q03"]],[15,"Dure ou douce : la taille apparente",["Q03"]],[16,"C'est l'ombre qui fabrique le volume",["Q03","Q04"]],[17,"Six lumières, six usages",["Q03","Q09"]],[18,"Pourquoi l'ombre est bleue",["Q03"]],[19,"Ce que le capteur peut avaler",["Q10"]],[20,"Cadrer la lumière, attendre le sujet",["Q03","Q09"]],[21,"Carte mémoire I",[]],[23,"Faire le tour du cadre",["Q07"]],[24,"Quatre accidents de bord",["Q07"]],[25,"Ne pas couper sur une articulation",["Q06"]],[26,"La hauteur change tout",["Q06"]],[27,"La distance décide de l'histoire",["Q08"]],[28,"Vertical ou horizontal, centre ou tiers",["Q06"]],[29,"Un cadre dans le cadre",["Q02","Q05"]],[30,"Symétrie et reflets",["Q06"]],[31,"La répétition, puis la rupture",["Q02"]],[32,"L'espace négatif et le poids visuel",["Q06"]],[33,"Le nombre d'or",["Q06"]],[34,"Carte mémoire II",[]],[36,"La chaîne de décision",["Q02","Q11"]],[37,"Séparer un sujet de son monde",["Q02","Q08"]],[38,"Exposer selon l'intention",["Q10"]],[39,"Mesurer, verrouiller, recomposer",["Q10"]],[40,"Se placer, puis attendre",["Q09","Q11"]],[41,"Recadrer : ce que ça répare",["Q06"]],[42,"Carte mémoire III",[]],[44,"Trier, et jeter",["Q12"]],[45,"Le raisonnement de développement",["Q12"]],[46,"Les quatre curseurs",["Q12"]],[47,"La courbe, sans mathématiques",["Q12"]],[48,"Lire l'histogramme",["Q10","Q12"]],[49,"Corriger la dominante, ou la garder",["Q03","Q12"]],[50,"La couleur, canal par canal",["Q12"]],[51,"Local, netteté, grain",["Q12"]],[52,"Ce qu'est réellement un préréglage",["Q12"]],[53,"Développer en quatre minutes",["Q12"]],[54,"Carte mémoire IV",[]],[56,"Sept niveaux, huit sorties",[]],[57,"Trois questions, et une case",[]],[59,"L'angle de champ disponible",["Q08"]],[60,"Quel format, quelle résolution",["Q10"]],[61,"Configurer l'appareil",["Q10"]],[62,"Combien assombrir",["Q10"]],[63,"Les curseurs, dans l'ordre",["Q12"]],[64,"Le jour où l'appareil change",["Q08"]]],"exercices":[["01","Une seule focale","Regard","Toute la sortie sur un seul angle de champ. Vous cessez de zoomer et vous vous mettez à marcher."],["02","Interdit debout","Composition","Aucune image à hauteur d'œil. Le point de vue est le levier le plus puissant et le moins utilisé."],["03","Le fond d'abord","Composition","Choisissez un fond propre, puis attendez qu'un sujet y entre."],["04","Le rai de lumière","Lumière","Trouvez une zone éclairée, cadrez-la, attendez trente minutes."],["05","La météo détestée","Anticipation","Sortez sous la pluie, le brouillard ou le ciel gris. Vous saurez exposer contre l'automatisme."],["06","Une heure, un lieu","Anticipation","Restez soixante minutes au même endroit. La dernière image ne ressemblera pas à la première."],["07","Dix images, pas onze","Décision","Dix déclenchements pour toute la sortie. Chaque image devient une décision assumée."],["08","Refaire","Autocritique","Retournez sur un lieu déjà photographié. Développez les deux séries côte à côte. Le seul exercice qui mesure votre progrès."]],"qlabel":{"Q01":"Où va mon œil ?","Q02":"Qu'est-ce que je veux isoler ?","Q03":"D'où vient la lumière ?","Q04":"Où sont les ombres ?","Q05":"Quel est mon premier plan ?","Q06":"Où est mon sujet dans le cadre ?","Q07":"Qu'est-ce qui parasite le cadre ?","Q08":"Quelle distance sert mon intention ?","Q09":"Quel moment dois-je attendre ?","Q10":"Quelle exposition protège l'image ?","Q11":"Est-ce que je déclenche maintenant ?","Q12":"Comment vais-je la développer ?"},"book_detail":{"8":{"eyebrow":"LE PREMIER QUART DE SECONDE","summary":"Devant une scène, votre œil se pose quelque part en moins d’un quart de seconde. Une photographie réussie est une photographie où votre regard et celui du spectateur vont au même endroit.","visual":"focus","takeaway":"Un seul point clair, un seul sujet net, un seul contraste fort : le regard n’a pas d’alternative."},"9":{"eyebrow":"LE MÉCANISME","summary":"Quatre leviers de séparation reviennent partout : ton, couleur, netteté, bord. Le test des yeux plissés permet de vérifier si la séparation existe.","visual":"separation","takeaway":"Aucune de ces quatre séparations ne se règle dans Lightroom : elles se décident d’abord au moment où vous choisissez où poser vos pieds."},"10":{"eyebrow":"PROFONDEUR","summary":"Une photographie est plate quand tout se trouve à la même distance. Faire entrer un élément proche suffit souvent à créer une troisième dimension.","visual":"depth","takeaway":"Premier plan · sujet · arrière-plan."},"11":{"eyebrow":"CONSTRUCTION","summary":"Une rue, un trottoir, une rambarde, une ombre portée : toute ligne est un chemin. Elle amène quelque part. Vérifiez toujours où.","visual":"lines","takeaway":"Placez le sujet là où les lignes se rejoignent, ou faites rentrer leur point de fuite dans le cadre."},"12":{"eyebrow":"TROIS SECONDES, AVANT CHAQUE IMAGE","summary":"Le fond enregistre aussi les quatre-vingts pour cent restants. Cinq défauts dominants peuvent détourner le regard du sujet.","visual":"frame","takeaway":"Trois secondes de vérification du fond corrigent plus d’images que trente minutes de retouche."},"36":{"eyebrow":"L’INVERSION QUI FAIT VIEILLIR AURORA CORRECTEMENT","summary":"La chaîne va de l’intention vers le réglage, jamais l’inverse. Elle reste vraie quel que soit l’appareil.","visual":"decision","takeaway":"Intention → décision photographique → contrainte de scène → outil disponible → réglage."},"37":{"eyebrow":"Q02 · QU’EST-CE QUE JE VEUX ISOLER ?","summary":"Isoler n’est pas grossir : c’est augmenter l’écart entre un sujet et tout ce qui l’entoure.","visual":"separation","takeaway":"Séparation spatiale → tonale et colorée → angle de champ → optique."},"38":{"eyebrow":"Q10 · QUELLE EXPOSITION PROTÈGE L’IMAGE ?","summary":"Exposer est une décision : au-delà d’un certain écart entre ombre et lumière, il faut choisir ce que l’on sauve.","visual":"exposure","takeaway":"Nommer la zone critique. Exposer pour elle. Sauf devant du blanc dominant."},"39":{"eyebrow":"LE GESTE QUI VAUT POUR TOUS LES APPAREILS","summary":"Mesurer, verrouiller, recomposer : le geste est universel ; seule la commande change.","visual":"decision","takeaway":"Choisir la zone critique → mesurer → verrouiller → corriger vers le bas → recomposer."},"40":{"eyebrow":"LA MÉTHODE DE LA RUE","summary":"Choisir un endroit, s’y installer, puis laisser les scènes venir. Cinq minutes au même endroit valent une heure de marche.","visual":"wait","takeaway":"Se placer, tout régler, baisser le téléphone, attendre, déclencher au point choisi."},"41":{"eyebrow":"APRÈS COUP","summary":"Le recadrage peut réparer certains accidents de bord, mais jamais la perspective, la lumière, le fond ou l’instant.","visual":"crop","takeaway":"Recadrer aide ; il ne remplace pas la prise de vue."},"44":{"eyebrow":"AVANT DE TOUCHER UN CURSEUR","summary":"Le tri est une compétence photographique. Choisir peu d’images permet de vraiment les travailler.","visual":"sort","takeaway":"10 secondes par image → garder une version par scène → revoir le lendemain."},"45":{"eyebrow":"AVANT LES CURSEURS","summary":"La boucle de développement ne dépend pas du logiciel : image → diagnostic → intention → décision → ajustement → vérification.","visual":"develop","takeaway":"Le préréglage arrive à l’étape 5 : il ne fait ni diagnostic, ni intention, ni décision."},"46":{"eyebrow":"ÉTAPES 4 À 6","summary":"Exposition, hautes lumières, ombres, noirs : quatre curseurs structurent la plupart des décisions tonales.","visual":"tones","takeaway":"Exposition d’abord, puis hautes lumières, ombres, noirs pour réancrer."},"47":{"eyebrow":"ÉTAPE 7","summary":"La courbe représente la relation entre luminosité d’origine et luminosité finale. Trois points suffisent sur un téléphone.","visual":"curve","takeaway":"Une courbe est un outil de contraste, pas une fin esthétique en soi."},"48":{"eyebrow":"L’INSTRUMENT","summary":"L’histogramme décrit combien de pixels occupent chaque luminosité. Il dit ce qui est perdu, pas ce qui est beau.","visual":"histogram","takeaway":"Il n’existe pas de bon histogramme universel."},"49":{"eyebrow":"ÉTAPE 3","summary":"La balance des blancs cherche votre intention, pas une neutralité obligatoire. Une dominante peut être corrigée ou assumée.","visual":"wb","takeaway":"Corriger quand la dominante est un accident ; la garder quand elle est le sujet."},"50":{"eyebrow":"ÉTAPE 8","summary":"Le TSL permet d’agir famille de couleur par famille de couleur. L’étalonnage agit en amont sur les primaires.","visual":"color","takeaway":"Vibrance plutôt que saturation globale ; orange pour la peau ; TSL pour corriger précisément."},"51":{"eyebrow":"ÉTAPES 9 ET 10","summary":"Le local sert à rétablir un équilibre, pas à peindre. Netteté, réduction du bruit et grain se travaillent avec retenue.","visual":"local","takeaway":"Un réglage local réussi ne se voit pas."},"52":{"eyebrow":"SANS MYTHOLOGIE","summary":"Un préréglage est une liste de positions de curseurs. Il ne connaît ni votre lumière, ni votre sujet, ni votre exposition.","visual":"preset","takeaway":"Rattraper l’exposition → vérifier les peaux → baisser l’intensité."},"53":{"eyebrow":"LE SOIR, UNE IMAGE À LA FOIS","summary":"Une discipline, pas un chronomètre : elle protège de l’acharnement.","visual":"develop","takeaway":"Recadrer → exposition → hautes lumières/ombres/noirs → préréglage → trois gestes → reposer et regarder."},"56":{"eyebrow":"UNE CONTRAINTE PAR SORTIE","summary":"Chaque exercice produit une compétence identifiable et chaque niveau suppose le précédent.","visual":"learn","takeaway":"Sept niveaux, huit sorties : regard, composition, lumière, anticipation, décision, autocritique."},"57":{"eyebrow":"APRÈS CHAQUE SORTIE","summary":"Le progrès vient du nombre de fois où l’on sait dire pourquoi une image était meilleure qu’une autre.","visual":"critique","takeaway":"Une meilleure image → pourquoi ? → qu’aurait-on changé ? → noter → réouvrir demain."},"59":{"eyebrow":"DE L’INTENTION À LA FOCALE","summary":"La distance décide du récit ; l’angle de champ décide de ce qui tient dans le cadre à cette distance.","visual":"device","takeaway":"L’angle de champ est un moyen, jamais l’intention."},"60":{"eyebrow":"UNE SEULE QUESTION","summary":"Quatre formats, avec des ordres de grandeur de poids et des usages différents. L’incertitude sur le 48 MP est volontairement conservée.","visual":"device","takeaway":"Le contrôle fiable reste ce que l’appareil affiche : l’incertitude n’est pas transformée en règle."},"61":{"eyebrow":"À FAIRE UNE SEULE FOIS","summary":"Configurer l’appareil, puis l’oublier : les réglages persistants sont une couche d’implémentation.","visual":"device","takeaway":"Le matériel ne doit pas devenir le système."},"62":{"eyebrow":"COMBIEN ASSOMBRIR","summary":"Les valeurs EV sont des points de départ, pas des consignes. Le contrôle fiable reste ce que l’on voit à l’écran.","visual":"exposure","take const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

function home(){return hero()+`<section class="section paper-band reveal"><div class="split"><div>${sectionHead('UNE SEULE ARCHITECTURE','Le livre disparaît. Le système reste.','Aurora n’est plus pensé comme 67 pages. Il devient un réseau de concepts, décisions, gestes, situations, diagnostics, exercices et outils.')}</div><div class="card" style="background:#e9e6df;color:#202327"><div class="eyebrow">DOUBLE VITESSE</div><h3>5 secondes</h3><p style="color:#565a60">Intention → clé → geste.</p><h3 style="margin-top:25px">20 minutes</h3><p style="color:#565a60">Principe → schéma → exemple → nuance → exercice.</p></div></div></section><section class="section dark-band reveal">${sectionHead('LE SYSTÈME NERVEUX','Les douze questions','Les Q01–Q12 ne sont plus un index. Elles deviennent une porte d’entrée dans tout Aurora.')}${questionGrid()}</section><section class="section reveal">${sectionHead('LA BOUCLE','Le cycle devient une interface','Chaque étape ouvre le bon territoire. Le système se referme sur la critique.')}${cycle()}</section><section class="section paper-band reveal">${sectionHead('UNE RÈGLE','L’appareil est remplaçable. La méthode ne l’est pas.','Le niveau matériel est une implémentation. Le reste du système demeure stable.')}${deviceCompare()}</section><footer class="section footer">AURORA VIII · prototype fonctionnel construit à partir du corpus VII. Les sources originales sont conservées dans <code>sources/</code> pour la traçabilité.</footer>`}

function visualFocus(){return `<div class="interactive"><div class="stage" style="background:linear-gradient(135deg,#c7d3df,#ece8df 48%,#5e6065)"><div style="position:absolute;inset:18% 10%;border:1px solid #3338"></div><div style="position:absolute;left:54%;top:53%;width:20px;height:65px;background:#202327;border-radius:12px"></div><div style="position:absolute;left:58%;top:45%;width:80px;height:80px;border:3px solid var(--red);border-radius:50%;transition:.3s" id="focusRing"></div></div><div class="control"><label>Déplace le point d’attention</label><input id="focusRange" type="range" min="20" max="80" value="58"><p class="muted">Le visiteur voit immédiatement que le cadre ne « choisit » pas tout seul son sujet : le contraste et la position font partie de la décision.</p></div></div>`}
function visualSeparation(){return `<div class="lab"><div class="stage separation"><div class="subject"></div><div class="halo" id="sepHalo"></div></div><div class="control"><label>Activer les couches de séparation</label>${['ton','couleur','netteté','bord','distance'].map((x,i)=>`<label><input type="checkbox" class="sepToggle" data-layer="${x}" ${i<2?'checked':''}> ${x}</label>`).join('')}<p class="muted">Le principe survit au changement d’appareil. La focale n’est qu’un moyen parmi plusieurs.</p></div></div>`}
function visualLight(){return `<div class="lab"><div class="stage light" id="lightStage"><div class="subject"></div><div class="shadow" id="lightShadow"></div></div><div class="control"><label>Position de la source</label><input id="lx" type="range" min="10" max="90" value="30"><input id="ly" type="range" min="10" max="70" value="30"><label>Distance apparente</label><input id="ld" type="range" min="10" max="90" value="35"><p class="muted">La scène montre une relation, pas une recette : direction, taille apparente et distance modifient la qualité des ombres.</p></div></div>`}
function decider(){return `<section class="section hero"><div class="eyebrow">DÉCIDER · Q02 / Q08 / Q10 / Q11</div><h1>L’intention<br>avant le réglage.</h1><p class="lede">La chaîne d’Aurora va toujours dans le même sens.</p></section><section class="section paper-band">${visualDecision()}</section><section class="section">${sectionHead('INTERACTION','Le cadre comme coupe anatomique','Ce qui entre. Ce qui sort. Ce qui attire l’œil. Ce qui le distrait.')}${visualFrame()}</section><section class="section dark-band">${bookCards([36,37,38,39,40,41])}</section>`}

function photographier(){return `<section class="section hero"><div class="eyebrow">PHOTOGRAPHIER · Q05–Q11</div><h1>Se placer.<br>Attendre.<br>Déclencher.</h1><p class="lede">Le corps, la lumière et le temps précèdent l’appareil.</p></section><section class="section">${sectionHead('MODE TERRAIN','Que dois-je faire maintenant ?','Une interface pensée pour la rue : quelques choix, une clé, un geste.')}${terrainMini()}</section><section class="section paper-band">${sectionHead('GESTES','Les six séquences exécutables','Le terrain n’est pas une collection de pages : c’est une série de gestes courts.')}${gestureCards()}</section>`}

function deviceLab(){return `<div class="interactive"><div class="control"><label>Implémentation actuelle</label><select id="deviceSelect"><option value="iphone17pro">iPhone 17 Pro · ProRAW · Lightroom</option><option value="fullframe">Boîtier hybride plein format · RAW</option></select></div><div id="devicePanel" style="margin-top:20px"></div></div>`}
function renderDevice(){const d=DATA.devices[state.device];$('#devicePanel').innerHTML=`<div class="grid-2"><div><div class="eyebrow">${d.status}</div><h3>${esc(d.name)}</h3><p class="muted">Format : ${esc(d.format)}<br>Développement : ${esc(d.development)}</p><div class="pillrow">${d.capture.map(x=>`<span class="badge">${esc(x)}</span>`).join('')}</div></div><div><div class="eyebrow">ANGLE DE CHAMP / MOYENS</div>${d.angles.map(a=>`<div class="trace-row"><b>${esc(a.label)}</b><span>${esc(a.eq)}</span><span>${esc(a.nature)} — ${esc(a.use)}</span></div>`).join('')}</div></div><div class="card" style="margin-top:14px"><div class="eyebrow">CONTINUITÉ</div>${d.continuity.map(r=>`<div class="trace-row"><b>${esc(r[0])}</b><span>AUJOURD’HUI</span><span>${esc(r[1])} → ${esc(r[2])}</span></div>`).join('')}</div><p class="muted small">Le système ne déduit pas de règle universelle à partir de cette implémentation. Les incertitudes du corpus VII restent des incertitudes.</p>`}
function traceView(){return `<div class="card"><div class="grid-3"><div><div class="stat">104</div><div class="stat-label">PAGES R6</div></div><div><div class="stat">67</div><div class="stat-label">PAGES R7</div></div><div><div class="stat">0</div><div class="stat-label">SUPPRESSIONS</div></div></div><div style="margin-top:25px"><div class="trace-row" style="font-weight:600"><b>R6</b><span>STATUT</span><span>CONTENU → DESTINATION</span></div>${TRACE.rows.slice(0,18).map(r=>`<div class="trace-row"><b>${r.r6}</b><span class="badge">${r.status}</span><span>${esc(r.content)} → ${esc(r.destination)}</span></div>`).join('')}</div><button class="pill" id="showAllTrace">AFFICHER LES 104 LIGNES</button></div>`}
function sourceLinks(){return `<div class="cards">${['AURORA Livre v7.pdf','AURORA Cartes Terrain v7.pdf','AURORA Carte Generale v7.pdf','AURORA Console v7.html','AURORA Note Architecture v7.md','AURORA Audit Factuel v7.md','AURORA Matrice Conservation R6 R7.md'].map(x=>`<a class="card" href="sources/${encodeURIComponent(x)}" target="_blank"><div class="code">SOURCE</div><h3>${esc(x.replace('AURORA ','').replace(' v7',''))}</h3><p>Référence de vérité conservée dans le prototype.</p></a>`).join('')}</div>`}
function terrain(){return `<section class="section hero"><div class="eyebrow">MODE TERRAIN</div><h1>Que vois-tu ?<br>Que veux-tu faire ?</h1><p class="lede">Deux choix. Puis la clé. Puis le geste.</p></section><section class="section paper-band"><div class="terrain-shell"><div class="terrain-step active" id="t1"><div class="eyebrow">01 · INTENTION</div><h2>Que veux-tu faire ?</h2><div class="big-actions">${DATA.intentions.map(i=>`<button class="big-action" data-terrain-intent="${i.id}"><strong>${esc(i.t)}</strong><span>${esc(i.decision)}</span></button>`).join('')}</div></div><div class="terrain-step" id="t2"><div class="eyebrow">02 · SITUATION</div><h2>Que vois-tu ?</h2><div class="big-actions">${DATA.cards.filter(c=>c.fam==='situation').map(c=>`<button class="big-action" data-terrain-sit="${c.id}"><strong>${esc(c.title)}</strong><span>${esc(c.key)}</span></button>`).join('')}</div><button class="pill" id="terrainBack">REVENIR</button></div><div class="terrain-step" id="t3"><div class="eyebrow">03 · LA CLÉ</div><div id="terrainResult"></div><button class="big-action" id="terrainReset"><strong>RECOMMENCER</strong><span>Changer d’intention ou de situation.</span></button></div></div></section>`}
function recherche(){return `<section class="section hero"><div class="eyebrow">RECHERCHER · INDEX TACTILE</div><h1>Écris ce que<br>tu vois.</h1><p class="lede">« mon sujet se perd », « ciel blanc », « pluie », « peau orange », Q02…</p></section><section class="section">${sectionHead('MOTEUR LOCAL','Un graphe, pas une IA externe','Recherche locale dans intentions, situations, symptômes, gestes, pages du Livre, questions et mots-clés.')}${searchUI()}</section>`}
function searchUI(){return `<div class="searchbox"><input id="searchInput" type="search" value="${esc(state.search)}" placeholder="isoler · sujet se perd · pluie · ciel blanc · Q10…"></div><div class="results" id="results"></div>`}
function searchItems(){const term=norm(state.search.trim());let out=[];const add=(kind,id,title,key,score)=>out.push({kind,id,title,key,score});if(!term){DATA.intentions.slice(0,6).forEach(i=>add('INTENTION',i.id,i.t,i.decision,1));DATA.cards.slice(0,8).forEach(c=>add(c.fam.toUpperCase(),c.id,c.title,c.key,1));return out}const toks=term.split(/\s+/).filter(Boolean);const score=(text)=>{const n=norm(text);return toks.reduce((s,t)=>s+(n.includes(t)?1:0),0)};DATA.intentions.forEach(i=>{const s=score(i.t+' '+i.decision+' '+i.gestes.join(' ')+' '+i.q);if(s)add('INTENTION',i.id,i.t,i.decision,s)});DATA.cards.forEach(c=>{const s=score(c.title+' '+c.intent+' '+c.key+' '+c.kw+' '+c.q.join(' ')+' '+JSON.stringify(c.blocks));if(s)add(c.fam.toUpperCase(),c.id,c.title,c.key,s)});DATA.book.forEach(b=>{const s=score(b[1]+' '+b[2].join(' '));if(s)add('LIVRE','P'+b[0],`Livre ${pad(b[0])} · ${b[1]}`,b[2].join(' '),s)});DATA.questions.forEach(q=>{const s=score(q.id+' '+q.label);if(s)add('QUESTION',q.id,q.label,'Entrée nerveuse du système',s)});return out.sort((a,b)=>b.score-a.score)}
function renderSearch(){const r=$('#results');if(!r)return;const items=searchItems();r.innerHTML=items.length?items.map(x=>`<div class="result-row"><span class="kind">${x.kind}</span><button data-search-id="${x.id}"><strong>${esc(x.title)}</strong><span class="rowkey">${esc(x.key)}</span></button><span class="source-chip">${x.score}·</span></div>`).join(''):`<div class="muted">Aucun résultat. Essayez un mot plus simple.</div>`}
function bookCards(nums){return `<div class="cards">${nums.map(n=>{const b=DATA.book.find(x=>x[0]===n);const d=DATA.book_detail[n];return b?`<button class="card reveal" data-book="${n}"><span class="accent" style="background:var(--blue)"></span><div class="code">LIVRE ${pad(n)} ${b[2].join(' ')}</div><h3>${esc(b[1])}</h3><p>${esc(d?.summary||'Entrée dans le corpus VII. Le contenu complet reste accessible via la source Livre.')}</p></button>`:''}).join('')}</div>`}
function openModal(title,body){const el=document.createElement('div');el.className='modal open';el.innerHTML=`<div class="sheet"><button class="close">FERMER</button>${title}${body}</div>`;document.body.appendChild(el);el.querySelector('.close').onclick=()=>el.remove();el.onclick=e=>{if(e.target===el)el.remove()};}
function openCard(id){const c=DATA.cards.find(x=>x.id===id);if(!c)return;let body=`<div class="eyebrow" style="color:var(--${c.fam==='symptome'?'red':c.fam==='geste'?'green':'amber'})">${c.fam.toUpperCase()} ${c.num} · ${c.q.join(' ')}</div><h2>${esc(c.title)}</h2>${c.intent?`<p class="lede">${esc(c.intent)}</p>`:''}<div class="result"><strong>LA CLÉ</strong><p>${esc(c.key)}</p></div>`;for(const b of c.blocks){if(b[1]==='list')body+=`<h3>${esc(b[0])}</h3><ul>${b[2].map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;else if(b[1]==='kv')body+=`<h3>${esc(b[0])}</h3>${b[2].map(x=>`<div class="trace-row"><b>${esc(x[0])}</b><span></span><span>${esc(x[1])}</span></div>`).join('')}`;else if(b[1]==='text')body+=`<div class="card"><div class="eyebrow">${esc(b[0])}</div><p>${esc(b[2])}</p></div>`;else if(b[1]==='sym')body+=b[2].map(x=>`<div class="card"><h3>${esc(x[0])}</h3><p class="accent-amber">${esc(x[1])}</p><p>${esc(x[2])}</p><span class="source-chip">${esc(x[3])}</span></div>`).join('');else if(b[1]==='steps')body+=`<div class="timeline">${b[2].map((x,i)=>`<div class="timeline-item"><span class="dot" style="background:var(--green)">${i+1}</span><div class="line"><h3>${esc(x[0])}</h3><p>${esc(x[1])}</p></div></div>`).join('')}</div>`}body+=`<p class="muted">${esc(c.note)}</p>`;openModal('',body)}
function openBook(n){const b=DATA.book.find(x=>x[0]===n),d=DATA.book_detail[n];if(!b)return;let body=`<div class="eyebrow" style="color:var(--blue)">LIVRE · PAGE ${pad(n)} · ${b[2].join(' ')}</div><h2>${esc(b[1])}</h2>${d?`<p class="lede">${esc(d.summary)}</p><div class="result"><strong>À RETENIR</strong><p>${esc(d.takeaway)}</p></div>${visualByType(d.visual)}`:`<p class="muted">Cette page est indexée dans le système. La source Livre complète reste conservée dans le prototype.</p>`}<div class="pillrow"><button class="pill" data-go="recherche">RECHERCHER AUTOUR</button><a class="pill" href="sources/AURORA%20Livre%20v7.pdf#page=${n}" target="_blank">OUVRIR LA SOURCE</a></div>`;openModal('',body)}
function visualByType(t){const map={separation:visualSeparation,light:visualLight,frame:visualFrame,decision:visualDecision,exposure:()=>`<div class="card"><h3>Zone critique</h3><p>Nommer → mesurer → verrouiller → recomposer.</p></div>`,depth:()=>`<div class="card"><h3>Premier plan · sujet · arrière-plan</h3><p>Faire entrer une distance différente suffit à donner de la profondeur.</p></div>`,lines:()=>`<div class="card"><h3>La ligne est un chemin</h3><p>Suivez-la. Si elle sort sans croiser le sujet, recadrez.</p></div>`,wait:()=>`<div class="card"><h3>Choisir · régler · attendre</h3><p>Cadrez la zone vide, puis laissez le sujet entrer.</p></div>`,crop:()=>`<div class="card"><h3>Répare / ne répare pas</h3><p>Le recadrage peut corriger un bord ; il ne corrige pas perspective, lumière, fond ou instant.</p></div>`,sort:()=>`<div class="card"><h3>10 s · une version · lendemain</h3><p>Le tri est le premier jugement sur son propre travail.</p></div>`,develop:developTimeline,tones:()=>`<div class="card"><h3>Exposition → HL → ombres → noirs</h3><p>Récupérer, puis réancrer.</p></div>`,curve:()=>`<div class="interactive"><div class="stage curve"><svg viewBox="0 0 400 260"><line x1="25" y1="235" x2="375" y2="25" stroke="#555"/><path d="M25 235 C100 225 140 90 220 70 S320 55 375 25" fill="none" stroke="#C78936" stroke-width="6"/></svg></div></div>`,histogram:histogramLab,wb:()=>`<div class="grid-3"><div class="card"><h3>Corrigée</h3><p>Fidèle, plate, sans heure.</p></div><div class="card"><h3>Telle que vue</h3><p>Dominante d’origine conservée.</p></div><div class="card"><h3>Assumée</h3><p>Le parti pris devient le sujet.</p></div></div>`,color:colorLab,local:()=>`<div class="grid-2"><div class="card"><h3>Local</h3><p>Rétablir un équilibre, pas peindre.</p></div><div class="card"><h3>Netteté / grain</h3><p>En dernier, avec retenue.</p></div></div>`,preset:()=>`<div class="card"><h3>Un preset est une liste de curseurs</h3><p>Il ne corrige ni exposition, ni balance, ni cadrage.</p></div>`,learn:learnProgress,critique:critiqueLab,device:deviceLab,lexicon:()=>`<div class="card"><h3>Lexique</h3><p>Définir précisément les termes du système et éviter les confusions.</p></div>`,map:()=>cycle,focus:visualFocus};return map[t]?map[t]():''}
function openExercise(id){const e=DATA.exercices.find(x=>x[0]===id);if(!e)return;openModal('',`<div class="eyebrow">SORTIE ${e[0]} · ${esc(e[2])}</div><h2>${esc(e[1])}</h2><p class="lede">${esc(e[3])}</p><div class="result"><strong>CONTRAINTE</strong><p>Faites la sortie sans ajouter de réglage inutile. À la fin, utilisez la revue du soir.</p></div>`)}
function bind(){
  $$('[data-go]').forEach(b=>b.onclick=()=>setRoute(b.dataset.go));
  $$('[data-q]').forEach(b=>b.onclick=()=>{state.search=b.dataset.q;setRoute('recherche');});
  $$('[data-card]').forEach(b=>b.onclick=()=>openCard(b.dataset.card));
  $$('[data-book]').forEach(b=>b.onclick=()=>openBook(+b.dataset.book));
  $$('[data-ex]').forEach(b=>b.onclick=()=>openExercise(b.dataset.ex));
  if($('#menuBtn'))$('#menuBtn').onclick=openDrawer; if($('#drawerClose'))$('#drawerClose').onclick=closeDrawer;
  if($('#focusRange'))$('#focusRange').oninput=e=>$('#focusRing').style.left=e.target.value+'%';
  $$('.sepToggle').forEach(x=>x.onchange=()=>{const a=$$('.sepToggle').filter(i=>i.checked).map(i=>i.dataset.layer);$('#sepHalo').style.boxShadow=a.includes('distance')?'0 0 100px 50px #0002':'';$('#sepHalo').style.background=a.includes('couleur')?'radial-gradient(circle,#d98b2b55,transparent 40%)':'';});
  ['lx','ly'].forEach(id=>{if($('#'+id))$('#'+id).oninput=()=>{$('#lightStage').style.setProperty('--lx',$('#lx').value+'%');$('#lightStage').style.setProperty('--ly',$('#ly').value+'%');}});if($('#ld'))$('#ld').oninput=e=>$('#lightShadow').style.width=(260-e.target.value*1.3)+'px';
  if($('#fgRange'))$('#fgRange').oninput=e=>$('#frameFg').style.width=e.target.value+'%';if($('#subRange'))$('#subRange').oninput=e=>$('#frameSubj').style.left=e.target.value+'%';if($('#clutterRange'))$('#clutterRange').oninput=e=>$('#frameStage').style.filter=e.target.value>60?'contrast(.8) saturate(1.4)':'';
  $$('#hist + .pillrow .pill').forEach(b=>b.onclick=()=>histState(b.dataset.hist));
  if($('#saveCritique'))$('#saveCritique').onclick=()=>{localStorage.setItem('aurora.critique',JSON.stringify({best:$('#bestImage').value,why:$('#whyImage').value,next:$('#nextConstraint').value,at:new Date().toISOString()}));toast('Contrainte enregistrée localement.');};
  if($('#deviceSelect')){$('#deviceSelect').value=state.device;$('#deviceSelect').onchange=e=>{state.device=e.target.value;renderDevice();};renderDevice();}
  if($('#showAllTrace'))$('#showAllTrace').onclick=()=>openModal('',`<div class="eyebrow">TRAÇABILITÉ R6 → R7 → SITE</div><h2>104 lignes</h2>${TRACE.rows.map(r=>`<div class="trace-row"><b>${r.r6}</b><span class="badge">${r.status}</span><span>${esc(r.content)} → ${esc(r.destination)}<br><small>${esc(r.comment)}</small></span></div>`).join('')}`);
  if($('#terrainBack'))$('#terrainBack').onclick=()=>{$('#t2').classList.remove('active');$('#t1').classList.add('active')};
  if($('#terrainReset'))$('#terrainReset').onclick=()=>{state.terrainIntent=null;state.terrainSituation=null;$('#t3').classList.remove('active');$('#t1').classList.add('active')};
  $$('[data-terrain-intent]').forEach(b=>b.onclick=()=>{state.terrainIntent=b.dataset.terrainIntent;$('#t1').classList.remove('active');$('#t2').classList.add('active')});
  $$('[data-terrain-sit]').forEach(b=>b.onclick=()=>{const c=DATA.cards.find(x=>x.id===b.dataset.terrainSit);const i=DATA.intentions.find(x=>x.id===state.terrainIntent);$('#t2').classList.remove('active');$('#t3').classList.add('active');$('#terrainResult').innerHTML=`<div class="result"><div class="eyebrow">${esc(i.t)} · ${esc(c.title)}</div><h2>${esc(c.key)}</h2><p>${esc(c.blocks.find(b=>b[1]==='list')?.[2]?.[0]||'')}</p><div class="card"><div class="eyebrow">DÉCISIONS SUR PLACE</div><ul>${(c.blocks.find(b=>b[1]==='list')?.[2]||[]).slice(0,3).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><button class="big-action" data-card="${c.id}"><strong>OUVRIR LA CARTE COMPLÈTE</strong><span>Configuration actuelle · Lightroom · nuance.</span></button></div>`;$('#terrainResult').querySelector('[data-card]').onclick=()=>openCard(c.id)});
  if($('#searchInput')){$('#searchInput').oninput=e=>{state.search=e.target.value;renderSearch()};renderSearch()}
}
function histState(mode){const bars=$$('#hist .bar');const h=mode==='center'?[5,9,15,28,50,78,92,78,50,28,15,9,5,3,2]:mode==='clipped'?[90,70,45,20,10,7,5,5,6,8,12,20,45,70,90]:[25,35,50,70,88,76,55,35,20,12,8,14,28,50,73];bars.forEach((b,i)=>b.style.height=h[i]+'%');$('#histText').textContent=mode==='clipped'?'Des pixels collés aux bords indiquent une perte potentielle : blancs écrêtés ou noirs bouchés.':'Une distribution n’est pas « belle » ou « laide » en soi : elle dépend de la scène et de l’intention.'}
function openDrawer(){$('#drawer').classList.add('open');$('#drawer').setAttribute('aria-hidden','false')}function closeDrawer(){if($('#drawer')){$('#drawer').classList.remove('open');$('#drawer').setAttribute('aria-hidden','true')}}function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}function observe(){const io=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&e.target.classList.add('in')),{threshold:.08});$$('.reveal').forEach(e=>io.observe(e))}
const pages={home,voir,decider,photographier,developper,critiquer,apprendre,outils,terrain,recherche};
load();

</script>
